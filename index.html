<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Life Dashboard">
<meta name="theme-color" content="#FFD489">
<title>Life Dashboard</title>
<style>
/* ---------- tokens ---------- */
:root{
  --bg:#FFF3DF;
  --bg-grad:linear-gradient(180deg,#FFD489 0%,#FFF3DF 260px);
  --surface:#FFFFFF;
  --surface2:#FFEACB;
  --ink:#38220F;
  --ink2:#9A7141;
  --ink3:#C6A87C;
  --line:#F6DDB6;
  --accent:#FF5714;
  --accent-ink:#FFF8F0;
  --gold:#FFAD05;
  --blue:#2E5BFF;
  --danger:#F2402E;
  --shadow:0 1px 2px rgba(150,80,20,.07),0 6px 20px rgba(150,80,20,.10);
  --sheet-shadow:0 -8px 40px rgba(90,40,5,.28);
  --c-film:#FF5714; --c-reading:#2E5BFF; --c-drawing:#FFAD05; --c-music:#B333FF;
  --c-fashion:#FF2E8A; --c-lifting:#FF3B30; --c-golf:#12C95B; --c-skiing:#00AEFF;
  --c-cooking:#FF8A00; --c-tennis:#8FC700; --c-journal:#00C2A8;
  --t-film:#FFE2D2; --t-reading:#DEE6FF; --t-drawing:#FFEFC5; --t-music:#F2E0FF;
  --t-fashion:#FFDCEC; --t-lifting:#FFDEDA; --t-golf:#D6F5E1; --t-skiing:#D4EFFF;
  --t-cooking:#FFE8CA; --t-tennis:#ECF5C8; --t-journal:#D0F4EC;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1005;
    --bg-grad:linear-gradient(180deg,#3A1B02 0%,#1B1005 260px);
    --surface:#281A0C;
    --surface2:#352511;
    --ink:#FBEDD6;
    --ink2:#C7A97F;
    --ink3:#8C7352;
    --line:#443019;
    --accent:#FF7038;
    --accent-ink:#2E1204;
    --gold:#FFC23D;
    --blue:#7D96FF;
    --danger:#FF6B5E;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
    --sheet-shadow:0 -8px 40px rgba(0,0,0,.6);
    --c-film:#FF7038; --c-reading:#7D96FF; --c-drawing:#FFC23D; --c-music:#CD7DFF;
    --c-fashion:#FF6FAE; --c-lifting:#FF6B5E; --c-golf:#4FE08D; --c-skiing:#4FC8FF;
    --c-cooking:#FFA53E; --c-tennis:#B8E03A; --c-journal:#3BDCC0;
    --t-film:#43200C; --t-reading:#1E2748; --t-drawing:#402D08; --t-music:#371F4A;
    --t-fashion:#45182C; --t-lifting:#431714; --t-golf:#10331F; --t-skiing:#0E2C3E;
    --t-cooking:#3E2609; --t-tennis:#2C330D; --t-journal:#0D332C;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1005;
  --bg-grad:linear-gradient(180deg,#3A1B02 0%,#1B1005 260px);
  --surface:#281A0C;
  --surface2:#352511;
  --ink:#FBEDD6;
  --ink2:#C7A97F;
  --ink3:#8C7352;
  --line:#443019;
  --accent:#FF7038;
  --accent-ink:#2E1204;
  --gold:#FFC23D;
  --blue:#7D96FF;
  --danger:#FF6B5E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
  --sheet-shadow:0 -8px 40px rgba(0,0,0,.6);
  --c-film:#FF7038; --c-reading:#7D96FF; --c-drawing:#FFC23D; --c-music:#CD7DFF;
  --c-fashion:#FF6FAE; --c-lifting:#FF6B5E; --c-golf:#4FE08D; --c-skiing:#4FC8FF;
  --c-cooking:#FFA53E; --c-tennis:#B8E03A; --c-journal:#3BDCC0;
  --t-film:#43200C; --t-reading:#1E2748; --t-drawing:#402D08; --t-music:#371F4A;
  --t-fashion:#45182C; --t-lifting:#431714; --t-golf:#10331F; --t-skiing:#0E2C3E;
  --t-cooking:#3E2609; --t-tennis:#2C330D; --t-journal:#0D332C;
}

/* ---------- base ---------- */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  min-height:100%;
  background:var(--bg);
  background-image:var(--bg-grad);
  background-repeat:no-repeat;
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.45;
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",sans-serif;text-wrap:balance;line-height:1.2}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{
  font:inherit;color:var(--ink);
  background:var(--surface2);
  border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;width:100%;
  -webkit-appearance:none;appearance:none;
}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:12px 0 5px;letter-spacing:.02em}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- app frame ---------- */
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 96px)}
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:flex;justify-content:space-around;
  max-width:560px;margin:0 auto;
  background:color-mix(in srgb,var(--surface) 88%,transparent);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
  padding:8px 8px calc(env(safe-area-inset-bottom) + 8px);
}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink3);padding:4px 16px;border-radius:12px}
.tabbar button.on{color:var(--accent)}
.tabbar svg{width:24px;height:24px}

/* ---------- headers ---------- */
.apphead{display:flex;align-items:flex-end;justify-content:space-between;margin:6px 2px 18px}
.apphead .date{font-size:13px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.08em}
.apphead h1{font-size:32px;font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(100deg,var(--accent) 10%,var(--gold) 55%,var(--blue) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.iconbtn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface);box-shadow:var(--shadow);color:var(--ink2);flex:none}
.iconbtn svg{width:20px;height:20px}
.pagehead{display:flex;align-items:center;gap:10px;margin:2px 0 16px}
.pagehead h1{font-size:26px;font-weight:800;letter-spacing:-.01em;flex:1}
.pagehead .swatch{width:10px;height:26px;border-radius:5px;flex:none}
.backbtn{display:flex;align-items:center;gap:2px;color:var(--accent);font-weight:600;font-size:15px;padding:6px 8px 6px 0;flex:none}
.backbtn svg{width:20px;height:20px}

/* ---------- dashboard grid ---------- */
.summarychip{display:flex;gap:10px;margin-bottom:16px}
.summarychip .chip{flex:1;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:10px 14px}
.chip .k{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.chip .l{font-size:12px;color:var(--ink2);font-weight:600}
.hobbygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.hobbycard{
  background:var(--surface);border-radius:18px;box-shadow:var(--shadow);
  padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;
  transition:transform .1s ease;
}
.hobbycard:active{transform:scale(.95)}
.hobbycard .ic{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.hobbycard .ic svg{width:28px;height:28px}
.hobbycard .nm{font-size:12.5px;font-weight:700;color:var(--ink)}
.hobbycard .sub{font-size:10.5px;color:var(--ink3);font-weight:600;margin-top:-6px}

/* ---------- cards & lists ---------- */
.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h2{font-size:15px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h2 .grow{flex:1}
.badge{background:var(--surface2);border-radius:100px;padding:1px 9px;font-size:12px;font-weight:800;color:var(--ink2);font-variant-numeric:tabular-nums}
.rowlist{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:12.5px;color:var(--ink2)}
.row .num{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink2);font-size:14px}
.rowbtn{color:var(--ink3);padding:6px}
.rowbtn svg{width:18px;height:18px}
.rowbtn.act{color:var(--accent)}
.pinbtn{color:var(--ink3);padding:6px}
.pinbtn.on{color:var(--accent)}
.pinbtn svg{width:18px;height:18px}
.empty{color:var(--ink3);font-size:14px;padding:10px 0;text-align:center}
.showmore{margin-top:10px;width:100%;padding:10px;border-radius:12px;background:var(--surface2);color:var(--ink2);font-weight:700;font-size:13.5px}
.tag{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;background:var(--surface2);color:var(--ink2);border-radius:100px;padding:2px 8px;flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button{padding:6px 12px;border-radius:100px;background:var(--surface2);font-size:12px;font-weight:700;color:var(--ink2)}
.chips button.on{background:var(--accent);color:var(--accent-ink)}
.filterrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.filterrow select{width:auto;flex:1;padding:8px 10px;font-size:13.5px}
.coverimg{width:38px;height:38px;border-radius:8px;object-fit:cover;flex:none;background:var(--surface2);display:block}

/* ---------- stat tiles ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stats.three{grid-template-columns:repeat(3,1fr)}
.stat{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;position:relative}
.stat .k{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat .k small{font-size:14px;font-weight:700;color:var(--ink2)}
.stat .l{font-size:12px;color:var(--ink2);font-weight:600;margin-top:1px}
.stat .adj{position:absolute;top:8px;right:8px;color:var(--ink3);padding:4px}
.stat .adj svg{width:14px;height:14px}

/* ---------- buttons ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:13px;border-radius:14px;font-weight:700;font-size:15.5px;
  background:var(--accent);color:var(--accent-ink);
}
.btn:active{filter:brightness(.92)}
.btn.quiet{background:var(--surface2);color:var(--ink)}
.btn.line{background:none;border:1.5px solid var(--line);color:var(--ink2)}
.btn.danger{background:none;border:1.5px solid var(--danger);color:var(--danger)}
.btn svg{width:18px;height:18px}
.btnrow{display:flex;gap:10px;margin-bottom:14px}
.btnrow .btn{flex:1}
.addbar{display:flex;gap:8px;margin-top:8px}
.addbar input{flex:1}
.addbar button{flex:none;width:44px;border-radius:10px;background:var(--surface2);color:var(--accent);display:flex;align-items:center;justify-content:center}
.addbar button svg{width:20px;height:20px}
.linkbtn{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:14px;color:var(--ink);text-decoration:none;font-weight:700;font-size:15px}
.linkbtn .lg{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.linkbtn .lg svg{width:20px;height:20px}
.linkbtn .arrow{margin-left:auto;color:var(--ink3)}

/* ---------- stars ---------- */
.stars{display:inline-flex;gap:2px}
.stars svg{width:18px;height:18px}
.stars.big svg{width:30px;height:30px}
.stars .on{color:var(--gold)}
.stars .off{color:var(--line)}
.stars button{display:flex;padding:2px}
.halfwrap{position:relative;display:inline-flex}
.halfwrap .half{position:absolute;left:0;top:0;width:50%;overflow:hidden;display:inline-flex}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(40,16,2,.45);z-index:60;opacity:0;transition:opacity .18s ease}
.scrim.show{opacity:1}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;
  max-width:560px;margin:0 auto;
  background:var(--surface);border-radius:22px 22px 0 0;box-shadow:var(--sheet-shadow);
  padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);
  transform:translateY(100%);transition:transform .22s cubic-bezier(.3,.9,.4,1);
  max-height:86vh;overflow-y:auto;
}
.sheet.show{transform:translateY(0)}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:2px auto 12px}
.sheet h2{font-size:19px;font-weight:800;margin-bottom:4px}
.sheet .sub{font-size:13.5px;color:var(--ink2);margin-bottom:6px}
.sheet .actions{display:flex;gap:10px;margin-top:18px}
.sheet .actions .btn{flex:1}
.pickgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.pickgrid button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px;border-radius:14px;background:var(--surface2)}
.pickgrid .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.pickgrid .ic svg{width:22px;height:22px}
.pickgrid span{font-size:10.5px;font-weight:700;color:var(--ink2)}
.seg{display:flex;background:var(--surface2);border-radius:11px;padding:3px;gap:2px;margin-bottom:12px;overflow-x:auto}
.seg button{flex:1;padding:7px 10px;border-radius:8px;font-size:13px;font-weight:700;color:var(--ink2);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* ---------- calendar ---------- */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhead h2{font-size:20px;font-weight:800}
.calhead .navs{display:flex;gap:6px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calgrid .dow{text-align:center;font-size:11px;font-weight:700;color:var(--ink3);padding:4px 0;text-transform:uppercase}
.cald{
  aspect-ratio:.82;border-radius:12px;display:flex;flex-direction:column;align-items:center;
  padding-top:6px;gap:3px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);
}
.cald.out{color:var(--ink3)}
.cald.today .dnum{background:var(--accent);color:var(--accent-ink);border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-weight:800}
.cald.sel{background:var(--surface);box-shadow:var(--shadow)}
.cald .dnum{width:26px;height:26px;display:flex;align-items:center;justify-content:center}
.cald .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:34px}
.cald .dots i{width:5px;height:5px;border-radius:50%;display:block}
.fab{
  position:fixed;right:calc(50% - 264px);bottom:calc(env(safe-area-inset-bottom) + 84px);z-index:41;
  width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--gold));color:#FFF8F0;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 20px rgba(255,100,20,.45);
}
@media (max-width:592px){.fab{right:20px}}
.fab svg{width:26px;height:26px}

/* ---------- pins / gallery / charts ---------- */
.pinboard{display:flex;flex-direction:column;gap:10px}
.pin{display:flex;align-items:center;gap:12px;background:var(--surface2);border-radius:14px;padding:10px 12px}
.pin .pdot{width:34px;height:34px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;flex:none}
.pin .pdot svg{width:16px;height:16px;transform:rotate(45deg)}
.pin .main{flex:1;min-width:0}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gal .ph{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:1;background:var(--surface2)}
.gal .ph img{width:100%;height:100%;object-fit:cover;display:block}
.gal .ph .cap{position:absolute;left:0;right:0;bottom:0;font-size:10px;font-weight:700;color:#FFF8F0;background:linear-gradient(transparent,rgba(30,10,0,.72));padding:14px 6px 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chartwrap{overflow-x:auto}
.chart{width:100%;height:auto;display:block}
.chart .bar{rx:3}
.chart text{font-family:-apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.attn{display:flex;flex-direction:column;gap:8px}
.attn .arow{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:12px;padding:9px 12px}
.attn .arow .ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.attn .arow .ic svg{width:16px;height:16px}
.attn .arow .t{flex:1;font-weight:700;font-size:14px}
.attn .arow .d{font-size:12.5px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.attn .arow.warn .d{color:var(--danger)}
.anselect{margin-bottom:14px;display:flex;align-items:center;gap:10px}
.anselect select{font-weight:700}

/* ---------- misc ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 100px);transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:100px;font-weight:700;font-size:14px;
  opacity:0;transition:all .25s ease;z-index:80;pointer-events:none;white-space:nowrap;box-shadow:var(--shadow);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.note{font-size:12.5px;color:var(--ink3);margin-top:10px;line-height:1.5}
.exname{font-weight:700;font-size:14.5px;margin-bottom:6px}
.exgrid{display:grid;grid-template-columns:1fr 1fr 1.2fr 1fr;gap:6px;margin-bottom:4px}
.exgrid input,.exgrid select{padding:8px 6px;text-align:center;font-size:14px;font-variant-numeric:tabular-nums;border-radius:8px}
.exgrid .cl{font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;text-align:center}
.exrow{padding:12px 0;border-bottom:1px solid var(--line)}
.exrow:last-child{border-bottom:none}
.exrow input.notes{margin-top:6px;font-size:13px;padding:7px 10px;text-align:left;border-radius:8px}
.dayvol{text-align:right;font-weight:800;margin-top:8px;font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink2)}
.hr{height:1px;background:var(--line);margin:14px 0;border:none}
.hidden{display:none!important}
</style>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
</head>
<body>
<div id="app"></div>
<nav class="tabbar" id="tabbar"></nav>
<div id="overlay"></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
/* ============================================================
   Hobby Hub — single-file hobby dashboard
   ============================================================ */

/* ---------- icons (inline SVG, stroke style) ---------- */
const SW='stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"';
const ICONS={
  film:`<svg viewBox="0 0 24 24" ${SW}><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 9h18M7 5l2 4M12 5l2 4M17 5l2 4"/></svg>`,

function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);}
let state, lsHadKey=false;
try{ const raw=localStorage.getItem(KEY); lsHadKey=!!raw; state=raw?JSON.parse(raw):defaultState(); }catch(e){ state=defaultState(); }
// merge any new top-level keys added in later versions
(function(){const d=defaultState();for(const k in d){if(state[k]===undefined)state[k]=d[k];}})();
function save(){
  const json=JSON.stringify(state);
  try{ localStorage.setItem(KEY,json); }catch(e){ toast('Storage full — export a backup'); }
  try{ kvSave(json); }catch(e){}
}
// second copy of state in IndexedDB — survives some cases where localStorage is cleared
function kvSave(json){

/* ---------- dates ---------- */
const DAY=86400000;
function dstr(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${dd}`;}
function todayStr(){return dstr(new Date());}
function parseD(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function daysBetween(a,b){return Math.round((parseD(b)-parseD(a))/DAY);}
function inLastDays(dateStr,n){const diff=daysBetween(dateStr,todayStr());return diff>=0&&diff<n;}
function fmtDate(s){const d=parseD(s);return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:d.getFullYear()===new Date().getFullYear()?undefined:'numeric'});}
function fmtMin(min){min=Math.round(min);if(min<60)return min+'m';const h=Math.floor(min/60),m=min%60;return m?`${h}h ${m}m`:`${h}h`;}
function startOfWeek(d){const x=new Date(d);const dow=(x.getDay()+6)%7;x.setDate(x.getDate()-dow);x.setHours(0,0,0,0);return x;}

/* ---------- logs ---------- */
function addLog(hobby,type,payload={},date){
  const log={id:uid(),hobby,type,date:date||todayStr(),...payload};
  state.logs.push(log); save(); return log;
}
function delLog(id){
  const log=state.logs.find(l=>l.id===id);
  state.logs=state.logs.filter(l=>l.id!==id);
  if(log&&log.photoId) photoDelete(log.photoId);
  save();
}
function logs(hobby,type){return state.logs.filter(l=>(!hobby||l.hobby===hobby)&&(!type||l.type===type));}
function countLast(hobby,type,days){return logs(hobby,type).filter(l=>inLastDays(l.date,days)).length;}
function sumLast(hobby,type,field,days){return logs(hobby,type).filter(l=>days==null||inLastDays(l.date,days)).reduce((a,l)=>a+(Number(l[field])||0),0);}
function off(key){return state.offsets[key]||0;}

/* ---------- photos (IndexedDB) ---------- */
let photoCache=new Map(); // id -> {id,dataUrl,kind,title,origin,date}
let idb=null;
function idbOpen(){
  return new Promise((res)=>{
    const rq=indexedDB.open('hobbyhub-photos',2);
    rq.onupgradeneeded=()=>{
      const db=rq.result;
      if(!db.objectStoreNames.contains('photos'))db.createObjectStore('photos',{keyPath:'id'});
      if(!db.objectStoreNames.contains('kv'))db.createObjectStore('kv',{keyPath:'id'});
    };
    rq.onsuccess=()=>res(rq.result);
    rq.onerror=()=>res(null);
  });
}
async function photosInit(){
  idb=await idbOpen(); if(!idb)return;
  await new Promise(res=>{
    const tx=idb.transaction('photos','readonly').objectStore('photos').getAll();
    tx.onsuccess=()=>{ (tx.result||[]).forEach(p=>photoCache.set(p.id,p)); res(); };
    tx.onerror=()=>res();
  });
  // if localStorage was wiped but the IndexedDB copy survived, recover from it
  if(!lsHadKey&&idb.objectStoreNames.contains('kv')){
    await new Promise(res=>{
      try{
        const rq=idb.transaction('kv','readonly').objectStore('kv').get('state');
        rq.onsuccess=()=>{
          try{
            const rec=rq.result;
            if(rec&&rec.json){
              const recovered=JSON.parse(rec.json);
              if(recovered&&Array.isArray(recovered.logs)&&recovered.logs.length>state.logs.length){
                state=recovered;
                (function(){const d=defaultState();for(const k in d){if(state[k]===undefined)state[k]=d[k];}})();
                save(); toast('Recovered your saved data');
              }
            }
          }catch(e){}
          res();
        };
        rq.onerror=()=>res();
      }catch(e){res();}
    });
  }
}
function photoPut(p){
  photoCache.set(p.id,p);
  if(idb){ try{ idb.transaction('photos','readwrite').objectStore('photos').put(p); }catch(e){} }
}
function photoDelete(id){
  photoCache.delete(id);
  if(idb){ try{ idb.transaction('photos','readwrite').objectStore('photos').delete(id); }catch(e){} }
}
function photosOf(kind){return [...photoCache.values()].filter(p=>p.kind===kind).sort((a,b)=>a.date<b.date?1:-1);}
function pickImage(cb){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='image/*';
  inp.onchange=()=>{
    const f=inp.files[0]; if(!f)return;
    const img=new Image();
    img.onload=()=>{
      const MAX=900;
      let w=img.width,h=img.height;
      if(Math.max(w,h)>MAX){const s=MAX/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      cb(cv.toDataURL('image/jpeg',.82));
      URL.revokeObjectURL(img.src);
    };
    img.src=URL.createObjectURL(f);
  };
  inp.click();
}

  return `<span class="off">${ICONS.star}</span>`;
}

function closeSheet(instant){
  const ov=$('#overlay');

  ov.querySelector('.scrim')?.classList.remove('show');

/* ---------- router ---------- */
let view={tab:'dash',page:null}; // page: 'film'|'analytics:film'|null
const viewStack=[];
function go(v,push=true){
  if(push) viewStack.push({...view});
  view=v; render(); window.scrollTo(0,0);
  history.pushState({},'','#'+(v.page||v.tab));
}
function back(){
  const prev=viewStack.pop();
  view=prev||{tab:'dash',page:null};
  render(); window.scrollTo(0,0);
}
window.addEventListener('popstate',()=>{ if(viewStack.length){const prev=viewStack.pop();view=prev;render();} });

<script>

/* wire() — attaches handlers common across pages via data attributes */
function wire(root){

function statTile(value,label,adjustKey,current,mode){
  return `<div class="stat"><div class="k">${value}</div><div class="l">${esc(label)}</div>
    ${adjustKey?`<button class="adj" data-adjust="${adjustKey}" data-label="${esc(label)}" data-current="${current}" data-mode="${mode||'count'}" aria-label="Adjust ${esc(label)}">${ICONS.edit}</button>`:''}
  </div>`;
}
function adjustSheet(key,label,current,mode){
  openSheet({
    title:'Adjust total',
    sub:`Correct “${label}” — e.g. to count things from before you started using the app.`,
    body:`<label>New value</label><input id="adj-v" type="number" inputmode="numeric" value="${current}">`,
    actions:[
      {label:'Cancel',style:'quiet',handler:()=>{}},
      {label:'Save',handler:(el)=>{
        const v=Number(el.querySelector('#adj-v').value);
        if(isNaN(v))return false;
        state.offsets[key]=(state.offsets[key]||0)+(v-current);
        save(); render(); toast('Updated');
      }},
    ],
  });
}
function linkBtn(href,label,colorKey,iconKey){
  return `<a class="linkbtn" href="${href}" target="_blank" rel="noopener">
    <span class="lg" style="background:${htint(colorKey)};color:${hcolor(colorKey)}">${ICONS[iconKey||colorKey]}</span>
    ${esc(label)}<span class="arrow">${ICONS.ext}</span></a>`;
}

/* ---------- LIFTING + DIETING ---------- */
function exData(cycle,d,e){
  const c=state.lifting.data['c'+cycle]||{};
  return (c[d]&&c[d][e])||{};
}
function setExData(cycle,d,e,patch){
  const key='c'+cycle;
  if(!state.lifting.data[key])state.lifting.data[key]={};
  if(!state.lifting.data[key][d])state.lifting.data[key][d]={};
  state.lifting.data[key][d][e]={...state.lifting.data[key][d][e],...patch};
  save();
}
function exVol(x){return (Number(x.sets)||0)*(Number(x.reps)||0)*(Number(x.weight)||0);}
function dayVolume(cycle,d){
  return PROGRAM_DAYS[d].ex.reduce((a,_,e)=>a+exVol(exData(cycle,d,e)),0);
}
function cycleVolume(c){return PROGRAM_DAYS.reduce((a,_,d)=>a+dayVolume(c,d),0);}
function pageLifting(){
  const cyc=state.lifting.cycle;
  const wk=logs('lifting','workout').filter(l=>parseD(l.date)>=startOfWeek(new Date())).length;
  const total=logs('lifting','workout').length;
  const days=PROGRAM_DAYS.map((day,d)=>{
    const vol=dayVolume(cyc,d);
    const done=logs('lifting','workout').some(l=>l.cycle===cyc&&l.day===d);
    return `<div class="row" data-sheet="lift-day" data-arg="${d}" role="button" style="cursor:pointer">
      <div class="main"><div class="t">${esc(day.title)} ${done?'<span style="color:var(--c-golf)">✓</span>':''}</div>
      <div class="s">${day.ex.length} exercises</div></div>
      <span class="num">${vol?vol.toLocaleString():''}</span>${ICONS.chevR.replace('<svg','<svg width="18" height="18" style="color:var(--ink3)"')}
    </div>`;
  }).join('');
  const cycVals=Array.from({length:N_CYCLES},(_,i)=>cycleVolume(i+1));
  const cycLabels=Array.from({length:N_CYCLES},(_,i)=>'C'+(i+1));
  return backBar('Lifting + Dieting','lifting')+`
    ${linkBtn('https://www.myfitnesspal.com','Open MyFitnessPal for dieting','lifting','cooking')}
    <div class="stats">
      ${statTile(wk,'lifts this week')}
      ${statTile(total,'sessions all-time')}
    </div>
    <div class="card">
      <h2><span class="grow">Program</span><span class="num">cycle volume ${cycleVolume(cyc).toLocaleString()}</span></h2>
      <div class="seg" id="cycseg">${Array.from({length:N_CYCLES},(_,i)=>`<button data-cyc="${i+1}" class="${cyc===i+1?'on':''}">C${i+1}</button>`).join('')}</div>
      <div class="rowlist">${days}</div>
    </div>
    <div class="card"><h2>Cycle volume</h2>${barChart(cycVals,cycLabels,hcolor('lifting'),{allTicks:true})}</div>`;
}
function sheetLiftDay(dArg){
  const d=Number(dArg), cyc=state.lifting.cycle, day=PROGRAM_DAYS[d];
  const rows=day.ex.map(([name,defSets],e)=>{
    const x=exData(cyc,d,e);
    const sets=x.sets??defSets;
    return `<div class="exrow" data-ex="${e}">
      <div class="exname">${esc(name)}</div>
      <div class="exgrid">
        <span class="cl">Sets</span><span class="cl">Reps</span><span class="cl">Weight</span><span class="cl">RIR</span>
        <input type="number" inputmode="numeric" data-f="sets" value="${sets??''}" placeholder="—">
        <input type="number" inputmode="numeric" data-f="reps" value="${x.reps??''}" placeholder="—">
        <input type="number" inputmode="decimal" data-f="weight" value="${x.weight??''}" placeholder="lb">
        <select data-f="rir"><option value="">—</option>${[3,2,1,0].map(r=>`<option ${String(x.rir)===String(r)?'selected':''} value="${r}">${r}</option>`).join('')}</select>
      </div>
      <input class="notes" data-f="notes" value="${esc(x.notes||'')}" placeholder="Notes">
    </div>`;
  }).join('');
  openSheet({
    title:day.title, sub:`Microcycle ${cyc}`,
    body:`<div>${rows}</div><div class="dayvol">day volume <span data-dayvol>${dayVolume(cyc,d).toLocaleString()}</span></div>`,
    actions:[
      {label:'Close',style:'quiet',handler:()=>{render();}},
      {label:'Mark session done',handler:()=>{
        addLog('lifting','workout',{cycle:cyc,day:d,title:day.title});
        render(); toast('Session logged 💪');
      }},
    ],
    onMount(el){
      el.querySelectorAll('.exrow').forEach(rowEl=>{
        const e=Number(rowEl.dataset.ex);
        rowEl.querySelectorAll('[data-f]').forEach(inp=>{
          const evt=inp.tagName==='SELECT'?'change':'input';
          inp.addEventListener(evt,()=>{
            setExData(cyc,d,e,{[inp.dataset.f]:inp.value});
            el.querySelector('[data-dayvol]').textContent=dayVolume(cyc,d).toLocaleString();
          });
        });
      });
    },
  });
}

function pageTennis(){

  const mins=(days)=>t(days).reduce((a,l)=>a+(Number(l.minutes)||0),0);
  const recent=[...t(null)].sort((a,b)=>a.date<b.date?1:-1);
  return backBar('Tennis','tennis')+`
    <div class="stats three">
      ${statTile(t(365).length,'sessions · year')}
      ${statTile(fmtMin(mins(7)),'time · 7 days')}

function ctxDate(){return view.tab==='cal'&&!view.page?calSel:todayStr();}

function shDate(el){return el.querySelector('#sh-date')?.value||todayStr();}

/* interactive half-star input: tap = full star, tap again = half star */
function wireStars(el,initial){
  const box=el.querySelector('[data-starbox]');
  box.dataset.val=initial||0;
  const paint=()=>{const v=Number(box.dataset.val);box.querySelectorAll('[data-star]').forEach(b=>{
    b.innerHTML=starHtml(Number(b.dataset.star),v);});};
  box.querySelectorAll('[data-star]').forEach(b=>b.addEventListener('click',()=>{
    const i=Number(b.dataset.star),v=Number(box.dataset.val);
    box.dataset.val=(v===i)?i-0.5:i;
    paint();
  }));
  paint();
}
function starBox(initial){
  return `<div data-starbox style="margin:8px 0 2px"><span class="stars big">${[1,2,3,4,5].map(i=>
    `<button type="button" data-star="${i}" aria-label="${i} stars">${starHtml(i,initial||0)}</button>`).join('')}</span></div>
    <p class="note" style="margin-top:4px">Tap a star twice for a half star.</p>`;
}
function starVal(el){return Number(el.querySelector('[data-starbox]').dataset.val)||0;}

const SHEETS={};

/* ---------- settings / backup ---------- */
SHEETS['settings']=()=>{
  openSheet({
    title:'Settings & backup',
    body:`
      <p class="sub">Your data lives on this phone. Export a backup now and then — it’s your safety net if the browser ever clears storage.</p>
      ${state.lastBackup?`<p class="note">Last backup: ${fmtDate(state.lastBackup)}</p>`:'<p class="note" style="color:var(--danger)">No backup yet.</p>'}
      <div class="actions" style="margin-top:8px">
        <button class="btn" id="bk-exp">Export backup</button>
        <button class="btn quiet" id="bk-imp">Import backup</button>
      </div>
      <hr class="hr">
      <button class="btn danger" id="bk-reset">Erase all data</button>
      <p class="note"><b>Important:</b> always open Life Dashboard the same way — the Home Screen icon. Safari, the Home Screen app, and in-app browsers each keep their own separate copy of your data.</p>`,
    onMount(el){
      el.querySelector('#bk-exp').addEventListener('click',exportBackup);
      el.querySelector('#bk-imp').addEventListener('click',importBackup);
      el.querySelector('#bk-reset').addEventListener('click',()=>{
        openSheet({title:'Erase everything?',sub:'This deletes all logs, lists, and photos on this device. A backup file is the only way back.',
          actions:[{label:'Cancel',style:'quiet',handler:()=>{}},
                   {label:'Erase all data',style:'danger',handler:()=>{
                      state=defaultState();save();
                      [...photoCache.keys()].forEach(photoDelete);
                      render();toast('Erased');}}]});
      });
    },
  });
};
async function exportBackup(){
  const payload=JSON.stringify({app:'hobby-hub',v:1,exported:todayStr(),state,photos:[...photoCache.values()]});
  const name=`life-dashboard-backup-${todayStr()}.json`;
  let dl=null;
  try{ dl=window.claude&&await window.claude.use('downloads'); }catch(e){}
  if(dl){
    try{
      await dl.save({filename:name,data:payload});
      state.lastBackup=todayStr();save();render();toast('Backup saved');
      return;
    }catch(e){ if(e&&e.code==='user_denied'){toast('Backup canceled');return;} }
  }
  openSheet({title:'Backup data',sub:'Copy this and save it anywhere safe (Notes, Files…). Paste it back under “Import backup” to restore.',
    body:`<textarea id="bk-txt" rows="6" readonly style="font-size:11px">${esc(payload)}</textarea>`,
    actions:[{label:'Copy to clipboard',handler:async(el)=>{
      try{await navigator.clipboard.writeText(payload);}catch(e){el.querySelector('#bk-txt').select();document.execCommand('copy');}
      state.lastBackup=todayStr();save();render();toast('Copied');
    }}]});
}
function importBackup(){
  openSheet({title:'Import backup',sub:'Pick a backup file, or paste backup text below. This replaces what’s on this phone.',
    body:`<button class="btn quiet" id="imp-file" style="margin-top:6px">Choose backup file</button>
      <label>Or paste backup text</label><textarea id="imp-txt" rows="4" placeholder="{…}"></textarea>`,
    actions:[{label:'Cancel',style:'quiet',handler:()=>{}},
      {label:'Restore',handler:(el)=>{const t=el.querySelector('#imp-txt').value.trim();if(!t){toast('Nothing to restore');return false;}return doRestore(t);}}],
    onMount(el){
      el.querySelector('#imp-file').addEventListener('click',()=>{
        const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json,text/plain';
        inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();
          r.onload=()=>{if(doRestore(r.result)!==false)closeSheet();};r.readAsText(f);};
        inp.click();
      });
    }});
}
function doRestore(text){
  try{
    const data=JSON.parse(text);
    if(!data.state||!Array.isArray(data.state.logs))throw 0;
    state=data.state;
    (function(){const d=defaultState();for(const k in d){if(state[k]===undefined)state[k]=d[k];}})();
    save();
    [...photoCache.keys()].forEach(photoDelete);
    (data.photos||[]).forEach(photoPut);
    render();toast('Backup restored');
  }catch(e){toast('That file isn’t a Life Dashboard backup');return false;}
}

function pageCalendar(){
  const y=calMonth.getFullYear(),m=calMonth.getMonth();
  const first=new Date(y,m,1),startDow=first.getDay(),dim=new Date(y,m+1,0).getDate();
  const byDate={};
  state.logs.forEach(l=>{(byDate[l.date]=byDate[l.date]||[]).push(l);});
  let cells='';
  for(let i=0;i<startDow;i++)cells+='<div class="cald out"></div>';
  for(let d=1;d<=dim;d++){
    const ds=dstr(new Date(y,m,d));
    const dl=byDate[ds]||[];
    const hobbies=[...new Set(dl.map(l=>l.hobby))].slice(0,4);
    cells+=`<button class="cald ${ds===todayStr()?'today':''} ${ds===calSel?'sel':''}" data-day="${ds}">
      <span class="dnum">${d}</span>
      <span class="dots">${hobbies.map(h=>`<i style="background:${hcolor(h)}"></i>`).join('')}</span>
    </button>`;
  }
  const sel=byDate[calSel]||[];
  const selRows=sel.map(l=>`
    <div class="row">
      <span class="ic" style="width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;background:${htint(l.hobby)};color:${hcolor(l.hobby)}">${ICONS[l.hobby]}</span>
      <div class="main"><div class="t">${esc(logLabel(l))}</div><div class="s">${H[l.hobby].name}</div></div>
      <button class="rowbtn" data-dellog="${l.id}" aria-label="Delete">${ICONS.trash}</button>
    </div>`).join('');
  return `
    <div class="apphead"><div><div class="date">Plan & log</div><h1>Calendar</h1></div></div>
    <div class="card">
      <div class="calhead">
        <h2>${calMonth.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h2>
        <div class="navs">
          <button class="iconbtn" data-cal="-1" aria-label="Previous month">${ICONS.chevL}</button>
          <button class="iconbtn" data-cal="1" aria-label="Next month">${ICONS.chevR}</button>
        </div>
      </div>
      <div class="calgrid">
        ${['S','M','T','W','T','F','S'].map(d=>`<div class="dow">${d}</div>`).join('')}
        ${cells}
      </div>
    </div>
    <div class="card"><h2>${calSel===todayStr()?'Today':fmtDate(calSel)}</h2>
      <div class="rowlist">${selRows||'<div class="empty">Nothing logged — tap + to add</div>'}</div>

    <button class="fab" data-sheet="cal-picker" aria-label="Log something">${ICONS.plus}</button>`;
}
function logLabel(l){
  if(l.type==='movie')return l.title||'Movie watched';
  if(l.type==='book')return l.title||'Book finished';
  if(l.type==='album')return l.title||'Album listened';
  if(l.type==='drawing')return l.title||'Drawing';
  if(l.type==='time')return `Drawing time · ${fmtMin(l.minutes||0)}`;
  if(l.type==='workout')return l.title||'Workout';
  if(l.type==='round')return `${l.course||'Round'} · ${l.strokes} (${l.vspar>0?'+':''}${l.vspar})`;
  if(l.type==='skiday')return `${l.resort||'Ski day'}${l.runs?` · ${l.runs} runs`:''}`;
  if(l.type==='recipe')return `Recipe · ${l.title||''}`;
  if(l.type==='plate')return `Plate · ${l.title||''}`;
  if(l.type==='restaurant')return `Ranked ${l.title||'a restaurant'}`;
  if(l.type==='session')return `Tennis · ${fmtMin(l.minutes||0)}`;
  if(l.type==='entry')return l.title||'Journal entry';
  return l.type;
}

/* ---------- analytics ---------- */
function weeklySeries(weeks,fn){
  const values=[],labels=[];
  const w0=startOfWeek(new Date());
  for(let i=weeks-1;i>=0;i--){
    const ws=new Date(w0);ws.setDate(ws.getDate()-7*i);
    const we=new Date(ws);we.setDate(we.getDate()+7);
    values.push(fn(ws,we));
    labels.push(ws.toLocaleDateString(undefined,{month:'numeric',day:'numeric'}));
  }
  return {values,labels};
}
function weeklyCounts(hobby,weeks,type){
  return weeklySeries(weeks,(ws,we)=>state.logs.filter(l=>(!hobby||l.hobby===hobby)&&(!type||l.type===type)&&parseD(l.date)>=ws&&parseD(l.date)<we).length);
}
function weeklySums(hobby,type,field,weeks){
  return weeklySeries(weeks,(ws,we)=>state.logs.filter(l=>l.hobby===hobby&&(!type||l.type===type)&&parseD(l.date)>=ws&&parseD(l.date)<we)
    .reduce((a,l)=>a+(Number(l[field])||0),0));
}
function barChart(values,labels,color,opts={}){
  const W=520,Hh=150,pad=8,axis=20;
  const max=Math.max(1,...values);
  const bw=(W-pad*2)/values.length;
  const maxIdx=values.indexOf(Math.max(...values));
  let bars='';
  values.forEach((v,i)=>{
    const h=v/max*(Hh-pad-axis-16);
    const x=pad+i*bw+2,y=Hh-axis-h;
    bars+=`<rect class="bar" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw-4).toFixed(1)}" height="${Math.max(h,v?3:1).toFixed(1)}" fill="${v?color:'var(--line)'}" opacity="${v?1:.6}"><title>${labels[i]}: ${v.toLocaleString()}</title></rect>`;
    if(i===maxIdx&&v>0)bars+=`<text x="${(x+(bw-4)/2).toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink2)">${v.toLocaleString()}</text>`;
  });
  const ticks=labels.map((lb,i)=>(opts.allTicks||i===0||i===labels.length-1)?`<text x="${(pad+i*bw+(bw-4)/2).toFixed(1)}" y="${Hh-5}" text-anchor="middle" font-size="10" fill="var(--ink3)">${lb}</text>`:'').join('');
  return `<div class="chartwrap"><svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Bar chart">
    <line x1="${pad}" y1="${Hh-axis}" x2="${W-pad}" y2="${Hh-axis}" stroke="var(--line)" stroke-width="1"/>
    ${bars}${ticks}</svg></div>`;
}
function pageAnalytics(){
  const opts=[['total','Totals — all hobbies'],...HOBBIES.filter(h=>h.key!=='fashion').map(h=>[h.key,h.name])];
  return `
    <div class="apphead"><div><div class="date">The big picture</div><h1>Analytics</h1></div></div>
    <div class="card anselect" style="padding:10px 12px;margin-bottom:14px">
      <select id="an-sel" aria-label="Choose analytics view">${opts.map(([v,n])=>`<option value="${v}" ${anSel===v?'selected':''}>${n}</option>`).join('')}</select>
    </div>
    ${anSel==='total'?anTotalHtml():anHobbyHtml(anSel)}`;
}
function anTotalHtml(){
  const per=(days)=>state.logs.filter(l=>inLastDays(l.date,days)).length;
  const wk=weeklyCounts(null,12);
  const active=HOBBIES.filter(h=>h.key!=='fashion');
  const attn=active.map(h=>{
    const ls=logs(h.key);
    const last=ls.length?ls.reduce((a,l)=>l.date>a?l.date:a,'0'):null;
    return {h,days:last?daysBetween(last,todayStr()):null};
  }).sort((a,b)=>(b.days??9999)-(a.days??9999)).slice(0,5);
  return `
    <div class="stats">
      ${statTile(state.logs.length,'logs all-time')}
      ${statTile(per(7),'weekly')}
      ${statTile(per(30),'monthly')}
      ${statTile(per(90),'past 12 weeks')}
    </div>
    <div class="card"><h2>Logs per week · last 12 weeks</h2>${barChart(wk.values,wk.labels,'var(--accent)')}</div>
    <div class="card"><h2>Falling behind</h2>
      <div class="attn">${attn.map(({h,days})=>`
        <div class="arow ${days==null||days>13?'warn':''}">
          <span class="ic" style="background:${htint(h.key)};color:${hcolor(h.key)}">${ICONS[h.key]}</span>
          <span class="t">${h.name}</span>
          <span class="d">${days==null?'never logged':days===0?'today ✓':days+'d ago'}</span>
        </div>`).join('')}
      </div>
    </div>`;
}
function anHobbyHtml(key){
  const h=H[key];
  let tiles='',chartTitle='Logs per week',series=weeklyCounts(key,12);
  if(key==='film'){
    tiles=statTile(logs('film','movie').length+off('film.total'),'movies — lifetime')+statTile(countLast('film','movie',30),'past month');
    chartTitle='Movies per week';series=weeklyCounts('film',12,'movie');
  }else if(key==='reading'){
    tiles=statTile(logs('reading','book').length+off('reading.total'),'books — lifetime')+statTile(countLast('reading','book',90),'last 12 weeks');
    chartTitle='Books per week';series=weeklyCounts('reading',12,'book');
  }else if(key==='drawing'){
    tiles=statTile(logs('drawing','drawing').length+off('drawing.count'),'drawings — lifetime')+statTile(countLast('drawing','drawing',30),'past month');
    chartTitle='Drawings per week';series=weeklyCounts('drawing',12,'drawing');
  }else if(key==='music'){
    tiles=statTile(logs('music','album').length+off('music.total'),'albums — lifetime')+statTile(countLast('music','album',7),'past 7 days');
    chartTitle='Albums per week';series=weeklyCounts('music',12,'album');
  }else if(key==='lifting'){
    const wkN=logs('lifting','workout').filter(l=>parseD(l.date)>=startOfWeek(new Date())).length;
    tiles=statTile(wkN,'lifts this week')+statTile(logs('lifting','workout').length,'sessions all-time')
      +statTile(state.lifting.cycle,'current microcycle')+statTile(cycleVolume(state.lifting.cycle).toLocaleString(),'current cycle volume');
    chartTitle='Sessions per week';series=weeklyCounts('lifting',12,'workout');
  }else if(key==='golf'){
    const rounds=logs('golf','round');
    const a=rounds.length?rounds.reduce((x,l)=>x+(Number(l.vspar)||0),0)/rounds.length:null;
    tiles=statTile(a==null?'—':(a>0?'+':'')+a.toFixed(1),'handicap')+statTile(countLast('golf','round',365),'rounds — past year')+statTile(rounds.length,'rounds all-time');
    chartTitle='Rounds per week';series=weeklyCounts('golf',12,'round');
  }else if(key==='skiing'){
    const all=logs('skiing','skiday');
    const yr=all.filter(l=>l.date.slice(0,4)===String(new Date().getFullYear()));
    const runsYr=yr.reduce((a,l)=>a+(Number(l.runs)||0),0);
    const runsTotal=all.reduce((a,l)=>a+(Number(l.runs)||0),0);
    tiles=statTile(yr.length,'days this year')+statTile(runsYr,'runs this year')
      +statTile(runsTotal,'runs — total')+statTile(all.length?(runsTotal/all.length).toFixed(1):'—','runs per ski day');
    chartTitle='Runs per week';series=weeklySums('skiing','skiday','runs',12);
  }else if(key==='cooking'){
    tiles=statTile(state.cooking.recipes.length,'recipes')+statTile(photosOf('plate').length,'plates')
      +statTile(state.cooking.restaurants.filter(r=>!r.want).length,'restaurants ranked')+statTile(state.cooking.restaurants.filter(r=>r.want).length,'reservations');
    chartTitle='Cooking logs per week';series=weeklyCounts('cooking',12);
  }else if(key==='tennis'){
    const mins=(days)=>logs('tennis','session').filter(l=>days==null||inLastDays(l.date,days)).reduce((a,l)=>a+(Number(l.minutes)||0),0);
    tiles=statTile(countLast('tennis','session',365),'sessions · year')+statTile(fmtMin(mins(7)),'time · 7 days')+statTile(fmtMin(mins(365)),'time · year');
    chartTitle='Minutes per week';series=weeklySums('tennis','session','minutes',12);
  }else if(key==='journal'){
    tiles=statTile(logs('journal','entry').length,'total entries')+statTile(countLast('journal','entry',30),'past month');
    chartTitle='Entries per week';series=weeklyCounts('journal',12,'entry');
  }
  const cls=(key==='golf'||key==='tennis')?' three':'';
  return `
    <div class="stats${cls}">${tiles}</div>
    <div class="card"><h2>${chartTitle} · last 12 weeks</h2>${barChart(series.values,series.labels,hcolor(key))}</div>`;
}

/* ---------- page-level delegated clicks & inputs ---------- */
document.addEventListener('click',e=>{
  const c=e.target.closest('[data-cyc]');
  if(c){state.lifting.cycle=Number(c.dataset.cyc);save();render();return;}
  const cal=e.target.closest('[data-cal]');
  if(cal){calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+Number(cal.dataset.cal),1);render();return;}
  const day=e.target.closest('.cald[data-day]');
  if(day){calSel=day.dataset.day;render();return;}
});
document.addEventListener('change',e=>{
  if(e.target&&e.target.id==='an-sel'){anSel=e.target.value;render();window.scrollTo(0,0);}
});

/* ---------- boot ---------- */
try{ if(navigator.storage&&navigator.storage.persist)navigator.storage.persist(); }catch(e){}
window.addEventListener('pagehide',()=>{try{save();}catch(e){}});
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden'){try{save();}catch(e){}} });
render();
photosInit().then(()=>{
  render();
  if(state.logs.length>10&&(!state.lastBackup||daysBetween(state.lastBackup,todayStr())>14)){
    setTimeout(()=>toast('Tip: back up your data in Settings'),1200);
  }
});
</script>
<script>
'use strict';
/* ============================================================
   PWA layer — service worker, real file downloads, storage health
   Loaded only in the self-hosted build.
   ============================================================ */

const APP_VERSION='2026.08.23-1';

/* ---------- service worker (offline launch + updates) ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}

/* ---------- real file download (replaces the artifact clipboard fallback) ---------- */
async function exportBackup(){
  const payload=JSON.stringify({app:'life-dashboard',v:2,exported:todayStr(),state,photos:[...photoCache.values()]});
  const name=`life-dashboard-backup-${todayStr()}.json`;
  try{
    const blob=new Blob([payload],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=name; a.rel='noopener';
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},1000);
    state.lastBackup=todayStr(); save(); render();
    toast('Backup saved to Files');
    return;
  }catch(e){}
  openSheet({title:'Backup data',sub:'Copy this and save it somewhere safe. Paste it back under “Import backup” to restore.',
    body:`<textarea id="bk-txt" rows="6" readonly style="font-size:11px">${esc(payload)}</textarea>`,
    actions:[{label:'Copy to clipboard',handler:async(el)=>{
      try{await navigator.clipboard.writeText(payload);}catch(e2){el.querySelector('#bk-txt').select();document.execCommand('copy');}
      state.lastBackup=todayStr();save();render();toast('Copied');
    }}]});
}

/* ---------- settings, with storage health + version ---------- */
SHEETS['settings']=()=>{
  const installed=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
  openSheet({
    title:'Settings & backup',
    body:`
      <p class="sub">Your data is stored on this phone. Export a backup now and then — it’s your safety net.</p>
      ${state.lastBackup?`<p class="note">Last backup: ${fmtDate(state.lastBackup)}</p>`:'<p class="note" style="color:var(--danger)">No backup yet.</p>'}
      <div class="actions" style="margin-top:8px">
        <button class="btn" id="bk-exp">Export backup</button>
        <button class="btn quiet" id="bk-imp">Import backup</button>
      </div>
      <hr class="hr">
      <h2 style="font-size:14px">Storage health</h2>
      <div class="rowlist" style="margin-top:2px">
        <div class="row"><div class="main"><div class="t">Installed to Home Screen</div>
          <div class="s">${installed?'Yes — data is protected from cleanup':'Not yet — open from your Home Screen icon'}</div></div>
          <span class="num">${installed?'✓':'—'}</span></div>
        <div class="row"><div class="main"><div class="t">Persistent storage</div>
          <div class="s" id="st-persist">checking…</div></div><span class="num" id="st-persist-i">…</span></div>
        <div class="row"><div class="main"><div class="t">Space used</div>
          <div class="s" id="st-space">checking…</div></div></div>
        <div class="row"><div class="main"><div class="t">Offline ready</div>
          <div class="s">${'serviceWorker' in navigator?'Yes — opens without a signal':'Not supported in this browser'}</div></div>
          <span class="num">${'serviceWorker' in navigator?'✓':'—'}</span></div>
      </div>
      <hr class="hr">
      <button class="btn danger" id="bk-reset">Erase all data</button>
      <p class="note">Version ${APP_VERSION} · Always open Life Dashboard from its Home Screen icon — Safari tabs and in-app browsers keep separate copies of your data.</p>`,
    onMount(el){
      el.querySelector('#bk-exp').addEventListener('click',exportBackup);
      el.querySelector('#bk-imp').addEventListener('click',importBackup);
      el.querySelector('#bk-reset').addEventListener('click',()=>{
        openSheet({title:'Erase everything?',sub:'This deletes all logs, lists, and photos on this device. A backup file is the only way back.',
          actions:[{label:'Cancel',style:'quiet',handler:()=>{}},
                   {label:'Erase all data',style:'danger',handler:()=>{
                      state=defaultState();save();
                      [...photoCache.keys()].forEach(photoDelete);
                      render();toast('Erased');}}]});
      });
      (async()=>{
        try{
          if(navigator.storage&&navigator.storage.persisted){
            let ok=await navigator.storage.persisted();
            if(!ok&&navigator.storage.persist)ok=await navigator.storage.persist();
            const t=el.querySelector('#st-persist'),i=el.querySelector('#st-persist-i');
            if(t){t.textContent=ok?'Granted — iOS won’t evict your logs':'Not granted — keep exporting backups';}
            if(i){i.textContent=ok?'✓':'!';i.style.color=ok?'':'var(--danger)';}
          }else{
            const t=el.querySelector('#st-persist');if(t)t.textContent='Not supported in this browser';
          }
          if(navigator.storage&&navigator.storage.estimate){
            const {usage}=await navigator.storage.estimate();
            const s=el.querySelector('#st-space');
            if(s)s.textContent=(usage/1048576).toFixed(1)+' MB used (photos included)';
          }
        }catch(e){}
      })();
    },
  });
};
</script>
</body>
</html>
