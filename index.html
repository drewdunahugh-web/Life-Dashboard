<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Life Dashboard">
<meta name="theme-color" content="#FFD489">
<title>Life Dashboard</title>
<style>
/* ---------- tokens ---------- */
:root{
  --bg:#FFF3DF;
  --bg-grad:linear-gradient(180deg,#FFD489 0%,#FFF3DF 260px);
  --surface:#FFFFFF;
  --surface2:#FFEACB;
  --ink:#38220F;
  --ink2:#9A7141;
  --ink3:#C6A87C;
  --line:#F6DDB6;
  --accent:#FF5714;
  --accent-ink:#FFF8F0;
  --gold:#FFAD05;
  --blue:#2E5BFF;
  --danger:#F2402E;
  --good:#12A150;
  --shadow:0 1px 2px rgba(150,80,20,.07),0 6px 20px rgba(150,80,20,.10);
  --sheet-shadow:0 -8px 40px rgba(90,40,5,.28);
  --c-film:#FF5714; --c-reading:#2E5BFF; --c-drawing:#FFAD05; --c-music:#B333FF;
  --c-fashion:#FF2E8A; --c-lifting:#FF3B30; --c-golf:#12C95B; --c-skiing:#00AEFF;
  --c-cooking:#FF8A00; --c-tennis:#8FC700; --c-journal:#00C2A8;
  --t-film:#FFE2D2; --t-reading:#DEE6FF; --t-drawing:#FFEFC5; --t-music:#F2E0FF;
  --t-fashion:#FFDCEC; --t-lifting:#FFDEDA; --t-golf:#D6F5E1; --t-skiing:#D4EFFF;
  --t-cooking:#FFE8CA; --t-tennis:#ECF5C8; --t-journal:#D0F4EC;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1005;
    --bg-grad:linear-gradient(180deg,#3A1B02 0%,#1B1005 260px);
    --surface:#281A0C;
    --surface2:#352511;
    --ink:#FBEDD6;
    --ink2:#C7A97F;
    --ink3:#8C7352;
    --line:#443019;
    --accent:#FF7038;
    --accent-ink:#2E1204;
    --gold:#FFC23D;
    --blue:#7D96FF;
    --danger:#FF6B5E;
    --good:#43D383;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
    --sheet-shadow:0 -8px 40px rgba(0,0,0,.6);
    --c-film:#FF7038; --c-reading:#7D96FF; --c-drawing:#FFC23D; --c-music:#CD7DFF;
    --c-fashion:#FF6FAE; --c-lifting:#FF6B5E; --c-golf:#4FE08D; --c-skiing:#4FC8FF;
    --c-cooking:#FFA53E; --c-tennis:#B8E03A; --c-journal:#3BDCC0;
    --t-film:#43200C; --t-reading:#1E2748; --t-drawing:#402D08; --t-music:#371F4A;
    --t-fashion:#45182C; --t-lifting:#431714; --t-golf:#10331F; --t-skiing:#0E2C3E;
    --t-cooking:#3E2609; --t-tennis:#2C330D; --t-journal:#0D332C;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1005;
  --bg-grad:linear-gradient(180deg,#3A1B02 0%,#1B1005 260px);
  --surface:#281A0C;
  --surface2:#352511;
  --ink:#FBEDD6;
  --ink2:#C7A97F;
  --ink3:#8C7352;
  --line:#443019;
  --accent:#FF7038;
  --accent-ink:#2E1204;
  --gold:#FFC23D;
  --blue:#7D96FF;
  --danger:#FF6B5E;
  --good:#43D383;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
  --sheet-shadow:0 -8px 40px rgba(0,0,0,.6);
  --c-film:#FF7038; --c-reading:#7D96FF; --c-drawing:#FFC23D; --c-music:#CD7DFF;
  --c-fashion:#FF6FAE; --c-lifting:#FF6B5E; --c-golf:#4FE08D; --c-skiing:#4FC8FF;
  --c-cooking:#FFA53E; --c-tennis:#B8E03A; --c-journal:#3BDCC0;
  --t-film:#43200C; --t-reading:#1E2748; --t-drawing:#402D08; --t-music:#371F4A;
  --t-fashion:#45182C; --t-lifting:#431714; --t-golf:#10331F; --t-skiing:#0E2C3E;
  --t-cooking:#3E2609; --t-tennis:#2C330D; --t-journal:#0D332C;
}

/* ---------- base ---------- */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  min-height:100%;
  background:var(--bg);
  background-image:var(--bg-grad);
  background-repeat:no-repeat;
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.45;
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",sans-serif;text-wrap:balance;line-height:1.2}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{
  font:inherit;color:var(--ink);
  background:var(--surface2);
  border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;width:100%;
  -webkit-appearance:none;appearance:none;
}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible,[contenteditable]:focus{outline:2px solid var(--accent);outline-offset:1px}
label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:12px 0 5px;letter-spacing:.02em}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- app frame ---------- */
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 96px)}
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:flex;justify-content:space-around;
  max-width:560px;margin:0 auto;
  background:color-mix(in srgb,var(--surface) 88%,transparent);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
  padding:8px 8px calc(env(safe-area-inset-bottom) + 8px);
}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink3);padding:4px 16px;border-radius:12px}
.tabbar button.on{color:var(--accent)}
.tabbar svg{width:24px;height:24px}

/* ---------- headers ---------- */
.apphead{display:flex;align-items:flex-end;justify-content:space-between;margin:6px 2px 18px}
.apphead .date{font-size:13px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.08em}
.apphead h1{font-size:32px;font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(100deg,var(--accent) 10%,var(--gold) 55%,var(--blue) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.iconbtn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface);box-shadow:var(--shadow);color:var(--ink2);flex:none}
.iconbtn svg{width:20px;height:20px}
.pagehead{display:flex;align-items:center;gap:10px;margin:2px 0 16px}
.pagehead h1{font-size:26px;font-weight:800;letter-spacing:-.01em;flex:1}
.pagehead .swatch{width:10px;height:26px;border-radius:5px;flex:none}
.backbtn{display:flex;align-items:center;gap:2px;color:var(--accent);font-weight:600;font-size:15px;padding:6px 8px 6px 0;flex:none}
.backbtn svg{width:20px;height:20px}

/* ---------- dashboard grid ---------- */
.summarychip{display:flex;gap:10px;margin-bottom:16px}
.summarychip .chip{flex:1;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:10px 14px}
.chip .k{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.chip .l{font-size:12px;color:var(--ink2);font-weight:600}
.hobbygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.hobbycard{
  background:var(--surface);border-radius:18px;box-shadow:var(--shadow);
  padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;
  transition:transform .1s ease;
}
.hobbycard:active{transform:scale(.95)}
.hobbycard .ic{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.hobbycard .ic svg{width:28px;height:28px}
.hobbycard .nm{font-size:12.5px;font-weight:700;color:var(--ink)}
.hobbycard .sub{font-size:10.5px;color:var(--ink3);font-weight:600;margin-top:-6px}

/* ---------- cards & lists ---------- */
.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h2{font-size:15px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h2 .grow{flex:1}
.badge{background:var(--surface2);border-radius:100px;padding:1px 9px;font-size:12px;font-weight:800;color:var(--ink2);font-variant-numeric:tabular-nums}
.rowlist{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:12.5px;color:var(--ink2)}
.row .num{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink2);font-size:14px}
.rowbtn{color:var(--ink3);padding:6px}
.rowbtn svg{width:18px;height:18px}
.rowbtn.act{color:var(--accent)}
.pinbtn{color:var(--ink3);padding:6px}
.pinbtn.on{color:var(--accent)}
.pinbtn svg{width:18px;height:18px}
.starbtn{color:var(--ink3);padding:6px}
.starbtn.on{color:var(--gold)}
.starbtn svg{width:18px;height:18px}
.empty{color:var(--ink3);font-size:14px;padding:10px 0;text-align:center}
.showmore{margin-top:10px;width:100%;padding:10px;border-radius:12px;background:var(--surface2);color:var(--ink2);font-weight:700;font-size:13.5px}
.morerow{display:flex;gap:8px;margin-top:10px}
.morerow .showmore{margin-top:0;flex:1}
.tag{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;background:var(--surface2);color:var(--ink2);border-radius:100px;padding:2px 8px;flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button{padding:6px 12px;border-radius:100px;background:var(--surface2);font-size:12px;font-weight:700;color:var(--ink2)}
.chips button.on{background:var(--accent);color:var(--accent-ink)}
.filterrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.filterrow select{width:auto;flex:1;padding:8px 10px;font-size:13.5px}
.searchbar{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:10px;padding:2px 10px;margin-bottom:8px}
.searchbar span{color:var(--ink3);display:flex}
.searchbar svg{width:16px;height:16px}
.searchbar input{border:none;background:none;padding:9px 0;font-size:14px}
.coverimg{width:38px;height:38px;border-radius:8px;object-fit:cover;flex:none;background:var(--surface2);display:block}
.viewtoggle{display:flex;gap:4px;background:var(--surface2);border-radius:9px;padding:3px;flex:none}
.viewtoggle button{padding:5px 8px;border-radius:6px;color:var(--ink3);display:flex}
.viewtoggle button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.viewtoggle svg{width:16px;height:16px}
.albumgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.albumtile{display:flex;flex-direction:column;gap:6px;text-align:left}
.albumtile .art{width:100%;aspect-ratio:1;border-radius:12px;object-fit:cover;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--ink3)}
.albumtile .art svg{width:32px;height:32px}
.albumtile .nm{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.albumtile .ar{font-size:11.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:-4px}

/* ---------- stat tiles ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stats.three{grid-template-columns:repeat(3,1fr)}
.stat{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;position:relative}
.stat .k{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat .k small{font-size:14px;font-weight:700;color:var(--ink2)}
.stat .l{font-size:12px;color:var(--ink2);font-weight:600;margin-top:1px}
.stat .adj{position:absolute;top:8px;right:8px;color:var(--ink3);padding:4px}
.stat .adj svg{width:14px;height:14px}

/* ---------- buttons ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:13px;border-radius:14px;font-weight:700;font-size:15.5px;
  background:var(--accent);color:var(--accent-ink);
}
.btn:active{filter:brightness(.92)}
.btn.quiet{background:var(--surface2);color:var(--ink)}
.btn.line{background:none;border:1.5px solid var(--line);color:var(--ink2)}
.btn.danger{background:none;border:1.5px solid var(--danger);color:var(--danger)}
.btn.sm{padding:10px;font-size:14px;border-radius:12px}
.btn svg{width:18px;height:18px}
.btnrow{display:flex;gap:10px;margin-bottom:14px}
.btnrow .btn{flex:1}
.addbar{display:flex;gap:8px;margin-top:8px}
.addbar input{flex:1}
.addbar button{flex:none;width:44px;border-radius:10px;background:var(--surface2);color:var(--accent);display:flex;align-items:center;justify-content:center}
.addbar button svg{width:20px;height:20px}
.linkbtn{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:14px;color:var(--ink);text-decoration:none;font-weight:700;font-size:15px}
.linkbtn .lg{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.linkbtn .lg svg{width:20px;height:20px}
.linkbtn .arrow{margin-left:auto;color:var(--ink3)}

/* ---------- stars ---------- */
.stars{display:inline-flex;gap:2px}
.stars svg{width:18px;height:18px}
.stars.big svg{width:32px;height:32px}
.stars .on{color:var(--gold)}
.stars .off{color:var(--line)}
.stars button{display:flex;padding:2px}
.halfwrap{position:relative;display:inline-flex}
.halfwrap .half{position:absolute;left:0;top:0;width:50%;overflow:hidden;display:inline-flex}
.starinput{touch-action:none;user-select:none;-webkit-user-select:none;display:inline-flex;padding:6px 2px}
.starval{font-size:13px;font-weight:700;color:var(--ink2);margin-left:8px;font-variant-numeric:tabular-nums}

/* ---------- rich text editor ---------- */
.rte{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface2)}
.rte-tools{display:flex;gap:2px;padding:5px 6px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rte-tools button{padding:6px 8px;border-radius:7px;color:var(--ink2);display:flex;align-items:center;justify-content:center}
.rte-tools button:active{background:var(--surface)}
.rte-tools svg{width:16px;height:16px}
.rte-tools .sep{width:1px;background:var(--line);margin:3px 3px}
.rte-body{padding:11px 12px;min-height:110px;font-size:15px;line-height:1.5;outline:none;overflow-wrap:anywhere}
.rte-body:empty:before{content:attr(data-ph);color:var(--ink3)}
.rte-body ul,.rte-body ol{padding-left:22px;margin:4px 0}
.rte-body li{margin:2px 0}
.rte-body blockquote{border-left:3px solid var(--line);padding-left:10px;margin:6px 0;color:var(--ink2)}
.rich{font-size:14px;line-height:1.5}
.rich ul,.rich ol{padding-left:20px;margin:4px 0}
.rich li{margin:2px 0}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(40,16,2,.45);z-index:60;opacity:0;transition:opacity .18s ease}
.scrim.show{opacity:1}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;
  max-width:560px;margin:0 auto;
  background:var(--surface);border-radius:22px 22px 0 0;box-shadow:var(--sheet-shadow);
  padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);
  transform:translateY(100%);transition:transform .22s cubic-bezier(.3,.9,.4,1);
  max-height:88vh;overflow-y:auto;
}
.sheet.show{transform:translateY(0)}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:2px auto 12px}
.sheet h2{font-size:19px;font-weight:800;margin-bottom:4px}
.sheet .sub{font-size:13.5px;color:var(--ink2);margin-bottom:6px}
.sheet .actions{display:flex;gap:10px;margin-top:18px}
.sheet .actions .btn{flex:1}
.pickgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.pickgrid button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px;border-radius:14px;background:var(--surface2)}
.pickgrid .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.pickgrid .ic svg{width:22px;height:22px}
.pickgrid span{font-size:10.5px;font-weight:700;color:var(--ink2)}
.seg{display:flex;background:var(--surface2);border-radius:11px;padding:3px;gap:2px;margin-bottom:12px;overflow-x:auto}
.seg button{flex:1;padding:7px 10px;border-radius:8px;font-size:13px;font-weight:700;color:var(--ink2);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* ---------- calendar ---------- */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhead .mbtn{display:flex;align-items:center;gap:5px;font-size:20px;font-weight:800;color:var(--ink);font-family:ui-rounded,-apple-system,sans-serif}
.calhead .mbtn svg{width:16px;height:16px;color:var(--accent)}
.calhead .navs{display:flex;gap:6px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calgrid .dow{text-align:center;font-size:11px;font-weight:700;color:var(--ink3);padding:4px 0;text-transform:uppercase}
.cald{
  aspect-ratio:.82;border-radius:12px;display:flex;flex-direction:column;align-items:center;
  padding-top:6px;gap:3px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);
}
.cald.out{color:var(--ink3)}
.cald.today .dnum{background:var(--accent);color:var(--accent-ink);border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-weight:800}
.cald.sel{background:var(--surface2);box-shadow:var(--shadow)}
.cald .dnum{width:26px;height:26px;display:flex;align-items:center;justify-content:center}
.cald .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:34px}
.cald .dots i{width:5px;height:5px;border-radius:50%;display:block}
.yearpick{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.yearpick .y{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.monthgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.monthgrid button{padding:14px 4px;border-radius:12px;background:var(--surface2);font-weight:700;font-size:14px;color:var(--ink2)}
.monthgrid button.on{background:var(--accent);color:var(--accent-ink)}
.fab{
  position:fixed;right:calc(50% - 264px);bottom:calc(env(safe-area-inset-bottom) + 84px);z-index:41;
  width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--gold));color:#FFF8F0;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 20px rgba(255,100,20,.45);
}
@media (max-width:592px){.fab{right:20px}}
.fab svg{width:26px;height:26px}

/* ---------- pins / gallery / charts ---------- */
.pinboard{display:flex;flex-direction:column;gap:10px}
.pin{display:flex;align-items:center;gap:12px;background:var(--surface2);border-radius:14px;padding:10px 12px}
.pin .pdot{width:34px;height:34px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;flex:none}
.pin .pdot svg{width:16px;height:16px;transform:rotate(45deg)}
.pin .main{flex:1;min-width:0}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gal .ph{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:1;background:var(--surface2)}
.gal .ph img{width:100%;height:100%;object-fit:cover;display:block}
.gal .ph .cap{position:absolute;left:0;right:0;bottom:0;font-size:10px;font-weight:700;color:#FFF8F0;background:linear-gradient(transparent,rgba(30,10,0,.72));padding:14px 6px 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.albumrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.albumrow:last-child{border-bottom:none}
.albumrow .cov{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:none;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--ink3)}
.albumrow .cov svg{width:22px;height:22px}
.chartwrap{overflow-x:auto}
.chart{width:100%;height:auto;display:block}
.chart .bar{rx:3}
.chart text{font-family:-apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.attn{display:flex;flex-direction:column;gap:8px}
.attn .arow{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:12px;padding:9px 12px}
.attn .arow .ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.attn .arow .ic svg{width:16px;height:16px}
.attn .arow .t{flex:1;font-weight:700;font-size:14px}
.attn .arow .d{font-size:12px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums;text-align:right}
.attn .arow.below .d{color:var(--danger)}
.attn .arow.above .d{color:var(--good)}
.anselect{margin-bottom:14px;display:flex;align-items:center;gap:10px}
.anselect select{font-weight:700}

/* ---------- switch ---------- */
.switchrow{display:flex;align-items:center;gap:12px;padding:10px 0}
.switchrow .main{flex:1}
.switch{width:50px;height:30px;border-radius:100px;background:var(--line);position:relative;flex:none;transition:background .18s ease}
.switch.on{background:var(--good)}
.switch i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .18s ease}
.switch.on i{transform:translateX(20px)}

/* ---------- scorecard ---------- */
.sctable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.sctable th{font-size:10.5px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;padding:4px 2px;text-align:center}
.sctable td{padding:3px 2px;text-align:center}
.sctable td.h{font-weight:800;font-size:14px;color:var(--ink2);width:36px}
.sctable input{padding:7px 2px;text-align:center;font-size:15px;border-radius:8px;font-variant-numeric:tabular-nums}
.sctable .sc{font-weight:800;font-size:14px;width:44px}
.sctable tr.tot td{border-top:2px solid var(--line);padding-top:8px;font-weight:800;font-size:15px}
.sctable tr.tot td.h{color:var(--ink)}
.sc-plus{color:var(--danger)}
.sc-minus{color:var(--good)}
.sc-even{color:var(--ink2)}

/* ---------- protocol (lifting) ---------- */
.protohead{background:linear-gradient(135deg,var(--c-lifting),var(--accent));color:#FFF8F0;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.protohead .wk{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;opacity:.85}
.protohead .big{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.protohead .sub2{font-size:13px;opacity:.9;font-weight:600}
.protobar{height:7px;border-radius:4px;background:rgba(255,255,255,.28);margin-top:12px;overflow:hidden}
.protobar i{display:block;height:100%;background:#FFF8F0;border-radius:4px}
.chk{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:none}
.chk .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;color:transparent}
.chk .box svg{width:14px;height:14px}
.chk.on .box{background:var(--good);border-color:var(--good);color:#fff}
.chk .t{flex:1;font-size:14.5px;font-weight:600}
.chk.on .t{color:var(--ink2);text-decoration:line-through}
.chk .v{font-size:13px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.macro{background:var(--surface2);border-radius:12px;padding:9px;text-align:center}
.macro .k{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.macro .l{font-size:10.5px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
.rules{font-size:13.5px;line-height:1.6;color:var(--ink2)}
.rules li{margin:4px 0 4px 18px}
.rules b{color:var(--ink)}
.stopli{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:var(--ink2);padding:4px 0}
.stopli span{color:var(--danger);font-weight:800;flex:none}
.cptrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.cptrow:last-child{border-bottom:none}
.cptrow .wkb{width:44px;height:44px;border-radius:12px;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;font-weight:800;line-height:1}
.cptrow .wkb small{font-size:9px;font-weight:700;color:var(--ink3);text-transform:uppercase}
.cptrow.done .wkb{background:var(--good);color:#fff}
.cptrow.done .wkb small{color:rgba(255,255,255,.8)}
.trendrow{display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums}
.trendrow .big{font-size:24px;font-weight:800}
.trendrow .dl{font-size:13px;font-weight:700}
.dl.down{color:var(--good)}.dl.up{color:var(--danger)}

/* ---------- misc ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 100px);transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:100px;font-weight:700;font-size:14px;
  opacity:0;transition:all .25s ease;z-index:80;pointer-events:none;white-space:nowrap;box-shadow:var(--shadow);max-width:88vw;overflow:hidden;text-overflow:ellipsis;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.note{font-size:12.5px;color:var(--ink3);margin-top:10px;line-height:1.5}
.exname{font-weight:700;font-size:14.5px;margin-bottom:6px}
.exgrid{display:grid;grid-template-columns:1fr 1fr 1.2fr 1fr;gap:6px;margin-bottom:4px}
.exgrid input,.exgrid select{padding:8px 6px;text-align:center;font-size:14px;font-variant-numeric:tabular-nums;border-radius:8px}
.exgrid .cl{font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;text-align:center}
.exrow{padding:12px 0;border-bottom:1px solid var(--line)}
.exrow:last-child{border-bottom:none}
.exrow input.notes{margin-top:6px;font-size:13px;padding:7px 10px;text-align:left;border-radius:8px}
.dayvol{text-align:right;font-weight:800;margin-top:8px;font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink2)}
.hr{height:1px;background:var(--line);margin:14px 0;border:none}
.hidden{display:none!important}

.headbtns{display:flex;gap:8px;flex:none;align-items:center}
.headbtns .iconbtn{position:relative;width:42px;height:42px}
.headbtns .iconbtn svg{width:21px;height:21px}
.headbtns .dotbadge{
  position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;
  background:var(--danger);color:#fff;font-size:10.5px;font-weight:800;line-height:18px;text-align:center;
  box-shadow:0 0 0 2px var(--bg);font-variant-numeric:tabular-nums;
}

/* ---------- in-app notification bar ---------- */
#notifhost{position:fixed;left:0;right:0;top:0;z-index:90;display:flex;justify-content:center;
  padding:calc(env(safe-area-inset-top) + 8px) 10px 0;pointer-events:none}
.notifbar{
  width:100%;max-width:540px;background:var(--surface);border-radius:16px;
  box-shadow:0 2px 6px rgba(0,0,0,.14),0 12px 34px rgba(0,0,0,.22);
  border:1px solid var(--line);overflow:hidden;pointer-events:auto;
  transform:translateY(-130%);transition:transform .28s cubic-bezier(.25,.9,.35,1),opacity .2s ease;
}
.notifbar.show{transform:translateY(0)}
.notifbar .nb-in{display:flex;align-items:flex-start;gap:11px;padding:12px 12px 13px}
.notifbar .nb-ic{width:36px;height:36px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center}
.notifbar .nb-ic svg{width:19px;height:19px}
.notifbar .nb-tx{flex:1;min-width:0}
.notifbar .nb-t{font-size:14.5px;font-weight:700;color:var(--ink);line-height:1.25}
.notifbar .nb-b{font-size:13px;color:var(--ink2);line-height:1.4;margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.notifbar .nb-x{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;color:var(--ink3);margin:-2px -2px 0 0}
.notifbar .nb-x svg{width:15px;height:15px}
.notifbar .nb-timer{height:3px;background:var(--line)}
.notifbar .nb-timer i{display:block;height:100%;background:var(--accent);width:100%;transform-origin:left center}
.notifbar.run .nb-timer i{animation:nbcount 5s linear forwards}
@keyframes nbcount{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@media (prefers-reduced-motion: reduce){
  .notifbar{transition:none}
  .notifbar.run .nb-timer i{animation:none;transform:scaleX(0)}
}

/* ---------- notification centre ---------- */
.nrow{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);align-items:flex-start;width:100%;text-align:left}
.nrow:last-child{border-bottom:none}
.nrow .nic{width:32px;height:32px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center}
.nrow .nic svg{width:17px;height:17px}
.nrow .nmain{flex:1;min-width:0}
.nrow .nt{font-size:14px;font-weight:700;color:var(--ink)}
.nrow .nb{font-size:12.5px;color:var(--ink2);line-height:1.4;margin-top:1px}
.nrow .nw{font-size:11px;color:var(--ink3);font-weight:600;margin-top:3px}
.nrow.unread .nt::after{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;
  background:var(--accent);margin-left:6px;vertical-align:middle}

/* ---------- reminders on the calendar ---------- */
.remrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.remrow:last-child{border-bottom:none}
.remrow.done .t{text-decoration:line-through;color:var(--ink2)}
.cald .dots i.rem{width:5px;height:5px;border-radius:1px;transform:rotate(45deg)}
.fieldrow{display:flex;gap:8px}
.fieldrow>div{flex:1}

/* ---------- dates ---------- */
const DAY=86400000;
function dstr(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${dd}`;}
function todayStr(){return dstr(new Date());}
function parseD(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function daysBetween(a,b){return Math.round((parseD(b)-parseD(a))/DAY);}
function inLastDays(dateStr,n){const diff=daysBetween(dateStr,todayStr());return diff>=0&&diff<n;}
function fmtDate(s){const d=parseD(s);return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:d.getFullYear()===new Date().getFullYear()?undefined:'numeric'});}
function fmtMin(min){min=Math.round(min);if(min<60)return min+'m';const h=Math.floor(min/60),m=min%60;return m?`${h}h ${m}m`:`${h}h`;}
function startOfWeek(d){const x=new Date(d);const dow=(x.getDay()+6)%7;x.setDate(x.getDate()-dow);x.setHours(0,0,0,0);return x;}

/* ---------- photos (IndexedDB) ---------- */
let photoCache=new Map();
let idb=null;
function idbOpen(){
  return new Promise((res)=>{
    const rq=indexedDB.open('hobbyhub-photos',2);
    rq.onupgradeneeded=()=>{
      const db=rq.result;
      if(!db.objectStoreNames.contains('photos'))db.createObjectStore('photos',{keyPath:'id'});
      if(!db.objectStoreNames.contains('kv'))db.createObjectStore('kv',{keyPath:'id'});
    };
    rq.onsuccess=()=>res(rq.result);
    rq.onerror=()=>res(null);
  });
}
async function photosInit(){
  idb=await idbOpen(); if(!idb)return;
  await new Promise(res=>{
    const tx=idb.transaction('photos','readonly').objectStore('photos').getAll();
    tx.onsuccess=()=>{ (tx.result||[]).forEach(p=>photoCache.set(p.id,p)); res(); };
    tx.onerror=()=>res();
  });
  if(!lsHadKey&&idb.objectStoreNames.contains('kv')){
    await new Promise(res=>{
      try{
        const rq=idb.transaction('kv','readonly').objectStore('kv').get('state');
        rq.onsuccess=()=>{
          try{
            const rec=rq.result;
            if(rec&&rec.json){
              const recovered=JSON.parse(rec.json);
              if(recovered&&Array.isArray(recovered.logs)&&recovered.logs.length>state.logs.length){
                state=recovered;
                (function(){const d=defaultState();for(const k in d){if(state[k]===undefined)state[k]=d[k];}})();
                save(); toast('Recovered your saved data');
              }
            }
          }catch(e){}
          res();
        };
        rq.onerror=()=>res();
      }catch(e){res();}
    });
  }
}
function photoPut(p){

}
function photoDelete(id){

function pickImage(cb){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='image/*';
  inp.onchange=()=>{
    const f=inp.files[0]; if(!f)return;
    const img=new Image();
    img.onload=()=>{
      const MAX=900;
      let w=img.width,h=img.height;
      if(Math.max(w,h)>MAX){const s=MAX/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      cb(cv.toDataURL('image/jpeg',.82));
      URL.revokeObjectURL(img.src);
    };
    img.src=URL.createObjectURL(f);
  };
  inp.click();
}

/* keep only the tags the editor can produce */
function safeHtml(html){
  const div=document.createElement('div');
  div.innerHTML=String(html||'');
  const ok=new Set(['UL','OL','LI','B','I','U','BR','DIV','P','SPAN','STRONG','EM','BLOCKQUOTE']);
  (function walk(node){
    [...node.children].forEach(el=>{
      if(!ok.has(el.tagName)){ el.replaceWith(...el.childNodes); return; }
      [...el.attributes].forEach(a=>{
        if(a.name==='style'&&/^(text-align|margin-left|padding-left):/.test(a.value))return;
        el.removeAttribute(a.name);
      });
      walk(el);
    });
  })(div);
  return div.innerHTML;
}

/* ---------- stars: tap anywhere or swipe across, half-star precision ---------- */
function starHtml(i,v){
  if(i<=v)return `<span class="on">${ICONS.star}</span>`;
  if(v===i-0.5)return `<span class="halfwrap"><span class="off">${ICONS.star}</span><span class="half"><span class="on">${ICONS.star}</span></span></span>`;
  return `<span class="off">${ICONS.star}</span>`;
}
function stars(rating,size){
  let s=`<span class="stars${size==='big'?' big':''}">`;
  for(let i=1;i<=5;i++)s+=starHtml(i,Number(rating)||0);
  return s+'</span>';
}
function fmtStars(r){r=Number(r)||0;return r%1?r.toFixed(1):String(r);}
function starBox(initial){
  return `<div data-starbox data-val="${Number(initial)||0}" style="margin:6px 0 2px;display:flex;align-items:center">
    <span class="stars big starinput" data-starrow>${[1,2,3,4,5].map(i=>starHtml(i,Number(initial)||0)).join('')}</span>
    <span class="starval" data-starval>${(Number(initial)||0)?fmtStars(initial):'—'}</span>
  </div>`;
}
function wireStars(el){
  const box=el.querySelector('[data-starbox]'); if(!box)return;
  const row=box.querySelector('[data-starrow]');
  const out=box.querySelector('[data-starval]');
  const paint=()=>{
    const v=Number(box.dataset.val)||0;
    row.innerHTML=[1,2,3,4,5].map(i=>starHtml(i,v)).join('');
    out.textContent=v?fmtStars(v):'—';
  };
  const valueAt=(clientX)=>{
    const r=row.getBoundingClientRect();
    const pct=(clientX-r.left)/r.width;
    let v=Math.ceil(pct*10)/2;
    return Math.max(0.5,Math.min(5,v));
  };
  let dragging=false;
  const set=(x)=>{ box.dataset.val=valueAt(x); paint(); };
  row.addEventListener('pointerdown',e=>{
    dragging=true;
    try{row.setPointerCapture(e.pointerId);}catch(err){}
    set(e.clientX); e.preventDefault();
  });
  row.addEventListener('pointermove',e=>{ if(dragging){set(e.clientX);e.preventDefault();} });
  const stop=()=>{dragging=false;};
  row.addEventListener('pointerup',stop);
  row.addEventListener('pointercancel',stop);
  paint();
}
function starVal(el){const b=el.querySelector('[data-starbox]');return b?Number(b.dataset.val)||0:0;}

/* ---------- rich text editor ----------
   "* " → bullets · "1. " → numbers · "-- " → em dash · "--> " → arrow      */
function richField(id,html,placeholder){
  const tool=(cmd,icon,label)=>`<button type="button" data-rte="${cmd}" aria-label="${label}" title="${label}">${icon}</button>`;
  return `<div class="rte" data-rtewrap>
    <div class="rte-tools">
      ${tool('insertUnorderedList',ICONS.bullet,'Bullet list')}
      ${tool('insertOrderedList',ICONS.numlist,'Numbered list')}
      <span class="sep"></span>
      ${tool('outdent',ICONS.outdent,'Outdent')}
      ${tool('indent',ICONS.indent,'Indent')}
      <span class="sep"></span>
      ${tool('justifyLeft',ICONS.alignL,'Align left')}
      ${tool('justifyCenter',ICONS.alignC,'Align center')}
      ${tool('justifyRight',ICONS.alignR,'Align right')}
    </div>
    <div class="rte-body" id="${id}" contenteditable="true" data-ph="${esc(placeholder||'')}">${safeHtml(html)}</div>
  </div>`;
}
function wireRich(root){
  root.querySelectorAll('[data-rtewrap]').forEach(wrap=>{
    const body=wrap.querySelector('.rte-body');
    wrap.querySelectorAll('[data-rte]').forEach(b=>{
      b.addEventListener('mousedown',e=>e.preventDefault());
      b.addEventListener('click',()=>{
        body.focus();
        try{document.execCommand(b.dataset.rte,false,null);}catch(e){}
      });
    });
    body.addEventListener('input',()=>rteAutoFormat(body));
  });
}
function rteAutoFormat(body){
  const sel=window.getSelection();
  if(!sel||!sel.rangeCount)return;
  const range=sel.getRangeAt(0);
  const node=range.startContainer;
  if(node.nodeType!==3)return;
  const pos=range.startOffset;
  const before=node.textContent.slice(0,pos);

  const replaceTail=(n,text)=>{
    const r=document.createRange();
    r.setStart(node,pos-n); r.setEnd(node,pos);
    r.deleteContents();
    if(text){
      const t=document.createTextNode(text);
      r.insertNode(t);
      const after=document.createRange();
      after.setStartAfter(t); after.collapse(true);
      sel.removeAllRanges(); sel.addRange(after);
    }
  };
  // arrow before em dash — "--> " is a superset of "-- "
  if(before.endsWith('--> ')){ replaceTail(4,'→ '); return; }
  if(before.endsWith('-- ')){ replaceTail(3,'— '); return; }

  // list triggers only at the very start of a line
  const inList=!!(node.parentElement&&node.parentElement.closest('li'));
  if(inList)return;
  const lineStart=before.lastIndexOf('\n')+1;
  const line=before.slice(lineStart);
  if(line==='* '){ replaceTail(2,''); try{document.execCommand('insertUnorderedList');}catch(e){} return; }
  if(/^\d+\.\s$/.test(line)){ replaceTail(line.length,''); try{document.execCommand('insertOrderedList');}catch(e){} return; }
}

function openSheet({title,sub,body,actions,onMount}){
  closeSheet(true);

  ov.innerHTML=`<div class="scrim"></div><div class="sheet" role="dialog" aria-label="${esc(title||'')}">

  </div>`;
  const scrim=ov.querySelector('.scrim');
  sheetEl=ov.querySelector('.sheet');
  scrim.addEventListener('click',()=>closeSheet());
  if(actions) actions.forEach((a,i)=>{
    sheetEl.querySelector(`[data-sa="${i}"]`).addEventListener('click',()=>{ if(a.handler(sheetEl)!==false) closeSheet(); });
  });

  requestAnimationFrame(()=>{scrim.classList.add('show');sEl.classList.add('show');});

function closeSheet(instant){
  const ov=$('#overlay');
  if(!ov||!ov.firstChild)return;
  if(instant){ov.innerHTML='';sheetEl=null;return;}
  ov.querySelector('.scrim')?.classList.remove('show');
  ov.querySelector('.sheet')?.classList.remove('show');
  setTimeout(()=>{ov.innerHTML='';},230);
  sheetEl=null;
}

function runSeeds(){
  let changed=false;
  const has=(arr,name,key)=>arr.some(x=>String(x[key||'title']||'').toLowerCase()===name.toLowerCase());

  if(!state.seeded.films){
    SEED_FILMS.forEach(([title,rating])=>{
      if(logs('film','movie').some(l=>String(l.title||'').toLowerCase()===title.toLowerCase()))return;
      state.logs.push({id:uid(),hobby:'film',type:'movie',date:todayStr(),title,rating,imported:true});
    });
    state.seeded.films=true; changed=true;
  }
  if(!state.seeded.restaurants){
    const addRest=(name,rating,location,want)=>{
      if(has(state.cooking.restaurants,name,'name'))return;
      state.cooking.restaurants.push({id:uid(),name,location:location||'Portland, OR',rating:rating||0,want:!!want,regular:false,imported:true});
    };
    SEED_RESTAURANTS_RATED.forEach(([n,r])=>addRest(n,r,'Portland, OR',false));
    SEED_RESTAURANTS_AWAY.forEach(([n,r,loc])=>addRest(n,r,loc,false));
    SEED_RESERVATIONS.forEach(n=>addRest(n,0,'Portland, OR',true));
    state.seeded.restaurants=true; changed=true;
  }
  if(!state.seeded.recipes){
    SEED_RECIPES.forEach(r=>{
      if(has(state.cooking.recipes,r.title))return;
      state.cooking.recipes.push({id:uid(),title:r.title,yield:r.yield,calories:'',price:'',
        protein:'',carbs:'',fat:'',ingredients:r.ingredients,steps:r.steps,date:todayStr(),imported:true});
    });
    state.seeded.recipes=true; changed=true;
  }
  // year + director onto the films already logged, then the watchlist
  if(!state.seeded.filmMeta){
    logs('film','movie').forEach(l=>{
      const m=FILM_META[normTitle(l.title)];
      if(!m)return;
      if(!l.year)l.year=m[0];
      if(!l.director)l.director=m[1];
    });
    state.seeded.filmMeta=true; changed=true;
  }
  if(!state.seeded.watchlist){
    SEED_WATCHLIST.forEach(([title,year,director])=>{
      const n=normTitle(title);
      if(state.film.watchlist.some(w=>normTitle(w.title)===n))return;
      if(logs('film','movie').some(l=>normTitle(l.title)===n))return;
      state.film.watchlist.push({id:uid(),title,year,director});
    });
    state.seeded.watchlist=true; changed=true;
  }
  if(!state.seeded.recipes2){
    SEED_RECIPES2.forEach(r=>{
      if(has(state.cooking.recipes,r.title))return;
      state.cooking.recipes.push({id:uid(),title:r.title,yield:r.yield||'',
        calories:r.calories||'',price:'',protein:'',carbs:'',fat:'',
        note:r.note||'',ingredients:r.ingredients,steps:r.steps,date:todayStr(),imported:true});
    });
    state.seeded.recipes2=true; changed=true;
  }
  // Redtail Golf Center — par card straight off Drew's sheet, front 36 / back 36
  if(!state.seeded.redtail){
    if(!state.golf.courses.some(c=>String(c.name||'').toLowerCase()==='redtail golf center')){
      state.golf.courses.push({id:uid(),name:'Redtail Golf Center',location:'Beaverton, OR',
        pars:{1:4,2:3,3:4,4:4,5:4,6:3,7:5,8:4,9:5,10:4,11:4,12:3,13:4,14:5,15:4,16:3,17:4,18:5}});
    }
    state.seeded.redtail=true; changed=true;
  }
  // one-time reset of the trial waist numbers and the setup boxes ticked while testing
  if(!state.seeded.protoReset0829){
    state.protocol.waist={};
    state.protocol.weeklyWaist={};
    delete state.protocol.startWaist;
    state.protocol.setup={};
    state.seeded.protoReset0829=true; changed=true;
  }
  if(!state.protocol.weeklyWaist)state.protocol.weeklyWaist={};
  if(changed)save();
}

<div id="themebg"></div>
<script>
'use strict';
/* ============================================================
   Theme registry, backdrops and rotation
   ============================================================ */
const THEMES=[
  {id:'sunset', name:'Sunset',  note:'The original warm palette',  swatch:['#FF5714','#FFAD05','#2E5BFF','#FFF3DF']},
  {id:'hanami', name:'Hanami',  note:'Indigo river on cream paper', swatch:['#1E4A72','#7BA5C4','#EE7B8A','#F7F1E6']},
  {id:'gilt',   name:'Gilt',    note:'Deco gold, hobbies as gems',  swatch:['#D4AF37','#E8285C','#2B5CE8','#12100C']},
  {id:'domain', name:'Domain',  note:'A shrine burning in the dark',swatch:['#E01F35','#2FE0D0','#E8DCC8','#0D0508']},
];
const ROTATIONS=[
  {id:'off',  name:'Off',      mins:0,   label:''},
  {id:'m30',  name:'30 min',   mins:30,  label:'half an hour'},
  {id:'h1',   name:'1 hour',   mins:60,  label:'an hour'},
  {id:'h3',   name:'3 hours',  mins:180, label:'three hours'},
];

const R2=n=>n.toFixed(1);

/* ---- Hanami: paper, river, blossom, moon ---- */
function bgHanami(){
  const W=372,Hh=760;
  const PAPER='#F7F1E6',DEEP='#1B3A5C',MIDB='#3E6E9B',MIST='#A8C6DC',PALE='#CFE0EA';
  const PINK='#F0929B',ROSE='#EE6E80',DEEPROSE='#D9435C',BRANCH='#4A3228';
  const SEGS=[[[306,150],[276,236],[198,282],[214,378]],
              [[214,378],[230,470],[320,478],[302,566]],
              [[302,566],[288,640],[196,660],[186,772]]];
  const pts=[];
  SEGS.forEach((sg,si)=>{
    for(let i=(si?1:0);i<=34;i++){
      const t=i/34,mt=1-t;
      const x=mt*mt*mt*sg[0][0]+3*mt*mt*t*sg[1][0]+3*mt*t*t*sg[2][0]+t*t*t*sg[3][0];
      const y=mt*mt*mt*sg[0][1]+3*mt*mt*t*sg[1][1]+3*mt*t*t*sg[2][1]+t*t*t*sg[3][1];
      const dx=3*mt*mt*(sg[1][0]-sg[0][0])+6*mt*t*(sg[2][0]-sg[1][0])+3*t*t*(sg[3][0]-sg[2][0]);
      const dy=3*mt*mt*(sg[1][1]-sg[0][1])+6*mt*t*(sg[2][1]-sg[1][1])+3*t*t*(sg[3][1]-sg[2][1]);
      const L=Math.hypot(dx,dy)||1;
      pts.push({x,y,nx:-dy/L,ny:dx/L});
    }
  });
  const wAt=i=>{const t=i/(pts.length-1);return 26+40*Math.sin(Math.PI*Math.min(1,t*1.12));};
  const ribbon=k=>'M'+pts.map((p,i)=>`${R2(p.x+p.nx*wAt(i)*k)} ${R2(p.y+p.ny*wAt(i)*k)}`).join(' L')+
    ' L'+pts.map((p,i)=>`${R2(p.x-p.nx*wAt(i)*k)} ${R2(p.y-p.ny*wAt(i)*k)}`).reverse().join(' L')+' Z';
  const flow=k=>'M'+pts.map((p,i)=>`${R2(p.x+p.nx*wAt(i)*k)} ${R2(p.y+p.ny*wAt(i)*k)}`).join(' L');
  const PETAL='M0,-2 C6,-6 8.5,-14 5.5,-19.5 C4.4,-21.6 2.4,-20.8 1.4,-17.6 C0.9,-19.4 0,-19.6 0,-19.6 '+
              'C0,-19.6 -0.9,-19.4 -1.4,-17.6 C-2.4,-20.8 -4.4,-21.6 -5.5,-19.5 C-8.5,-14 -6,-6 0,-2 Z';
  const blossom=(cx,cy,sc,rot,c,e)=>{
    let o=`<g transform="translate(${cx} ${cy}) rotate(${rot}) scale(${sc})">`;
    for(let i=0;i<5;i++)o+=`<path d="${PETAL}" transform="rotate(${i*72})" fill="${c}"/>`;
    for(let i=0;i<5;i++)o+=`<path d="M0,-3 L0,-14" transform="rotate(${i*72+36})" stroke="${e}" stroke-width="1.1" opacity=".5"/>`;
    return o+`<circle r="2.6" fill="${DEEPROSE}"/></g>`;
  };
  let s=`<defs>
    <radialGradient id="hMoon" cx="34%" cy="26%" r="78%">
      <stop offset="0%" stop-color="#16304C"/><stop offset="62%" stop-color="#1E4166"/><stop offset="100%" stop-color="#4E7BA0"/></radialGradient>
    <linearGradient id="hShaft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFCF3" stop-opacity=".85"/><stop offset="100%" stop-color="#FFFCF3" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="${W}" height="${Hh}" fill="${PAPER}"/>
  <path d="M300 -40 L372 -40 L120 800 L34 800 Z" fill="url(#hShaft)"/>
  <path d="M232 -40 L268 -40 L54 800 L18 800 Z" fill="url(#hShaft)" opacity=".6"/>
  <circle cx="320" cy="6" r="50" fill="url(#hMoon)"/>`;
  for(let i=0;i<24;i++){
    const ang=i*137.5*Math.PI/180, rr=7+(i*2.1)%43;
    s+=`<circle cx="${R2(320+rr*Math.cos(ang))}" cy="${R2(6+rr*Math.sin(ang))}" r="${i%4?0.7:1.1}" fill="#EAF2F8" opacity="${i%3?0.4:0.7}"/>`;
  }
  s+=`<path d="${ribbon(1)}" fill="${PALE}" opacity=".85"/>`;
  s+=`<path d="${ribbon(0.82)}" fill="${MIST}" opacity=".9"/>`;
  s+=`<path d="${ribbon(0.6)}" fill="${MIDB}" opacity=".92"/>`;
  s+=`<path d="${ribbon(0.34)}" fill="${DEEP}"/>`;
  [0.93,0.75,0.5,0.24,-0.24,-0.5,-0.75,-0.93].forEach((k,i)=>{
    s+=`<path d="${flow(k)}" fill="none" stroke="#FBFDFE" stroke-width="${i%2?0.8:1.3}" opacity="${Math.abs(k)>0.7?0.5:0.34}"/>`;
  });
  const br=(d,w)=>`<path d="${d}" fill="none" stroke="${BRANCH}" stroke-width="${w}" stroke-linecap="round" opacity=".9"/>`;
  s+=br('M262 232 C238 214 214 196 186 186',3.4)+br('M232 212 C224 196 214 184 200 174',2.2)+
     br('M244 222 C250 206 258 194 268 186',2)+br('M60 452 C82 424 106 402 134 388',3.4)+
     br('M84 424 C82 406 78 392 68 380',2.2)+br('M120 392 C136 386 150 384 164 386',2);
  s+=blossom(196,180,1.05,12,PINK,ROSE)+blossom(224,206,0.9,-24,ROSE,DEEPROSE)+
     blossom(262,186,0.8,40,PINK,ROSE)+blossom(174,200,0.72,-8,ROSE,DEEPROSE)+
     blossom(96,398,1.15,-14,PINK,ROSE)+blossom(132,428,0.95,26,ROSE,DEEPROSE)+
     blossom(64,438,0.8,8,PINK,ROSE)+blossom(152,412,0.62,16,PINK,ROSE);
  [[300,258],[314,286],[292,300],[326,246],[58,540],[74,566],[46,586],[286,120],[330,320],[40,510],[176,600],[196,626]]
    .forEach((p,i)=>{s+=`<circle cx="${p[0]}" cy="${p[1]}" r="${i%3?2.1:3}" fill="${i%2?ROSE:DEEPROSE}" opacity="${i%3?0.6:0.8}"/>`;});
  s+=`<rect x="330" y="700" width="24" height="24" rx="3" fill="#D6453A"/>`;
  return {vb:`0 0 ${W} ${Hh}`,par:'xMidYMid slice',body:s};
}

/* ---- Gilt: bladed fan, medallion, columns, border ---- */
function bgGilt(){
  const W=372,Hh=760,HL='#F5E6B4',MID='#C9A227',DP='#8A6A1A',CX=186,CY=218,D=Math.PI/180;
  let s=`<defs>
    <linearGradient id="gBlade" x1="0" y1="1" x2="0.35" y2="0">
      <stop offset="0%" stop-color="${DP}"/><stop offset="46%" stop-color="${MID}"/>
      <stop offset="78%" stop-color="${HL}"/><stop offset="100%" stop-color="${MID}"/></linearGradient>
    <linearGradient id="gCol" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="${DP}"/><stop offset="40%" stop-color="${HL}"/><stop offset="100%" stop-color="${MID}"/></linearGradient>
    <radialGradient id="gMed" cx="38%" cy="30%" r="72%">
      <stop offset="0%" stop-color="${HL}"/><stop offset="60%" stop-color="${MID}"/><stop offset="100%" stop-color="${DP}"/></radialGradient>
  </defs>
  <rect width="${W}" height="${Hh}" fill="#0C0A07"/>`;
  for(let i=0;i<64;i++){
    const a=i*(360/64)*D, r1=i%2?300:460;
    s+=`<path d="M${R2(CX+40*Math.cos(a))} ${R2(CY+40*Math.sin(a))} L${R2(CX+r1*Math.cos(a))} ${R2(CY+r1*Math.sin(a))}" `+
       `stroke="${MID}" stroke-width="${i%4===0?1.1:0.6}" opacity="${i%4===0?0.4:0.22}"/>`;
  }
  for(let i=0;i<11;i++){
    const k=i-5, a=(-90+k*14)*D, len=196-Math.abs(k)*17;
    const ca=Math.cos(a),sa=Math.sin(a),px=-sa,py=ca,r0=44;
    const P=(r,w)=>`${R2(CX+ca*r+px*w)} ${R2(CY+sa*r+py*w)}`;
    const d=`M${P(r0,4.5)} L${P(r0+len,12.5)} L${P(r0+len+18,0)} L${P(r0+len,-12.5)} L${P(r0,-4.5)} Z`;
    s+=`<path d="${d}" fill="url(#gBlade)" opacity=".92"/>`;
    s+=`<path d="${d}" fill="none" stroke="${HL}" stroke-width=".8" opacity=".5"/>`;
    s+=`<path d="M${P(r0+8,0)} L${P(r0+len,0)}" stroke="#0C0A07" stroke-width="1.1" opacity=".45"/>`;
  }
  s+=`<circle cx="${CX}" cy="${CY}" r="37" fill="#0C0A07"/>
      <circle cx="${CX}" cy="${CY}" r="33" fill="none" stroke="url(#gMed)" stroke-width="9"/>
      <circle cx="${CX}" cy="${CY}" r="27.5" fill="none" stroke="${DP}" stroke-width="1" opacity=".8"/>
      <circle cx="${CX}" cy="${CY}" r="18" fill="url(#gMed)"/>
      <circle cx="${CX}" cy="${CY}" r="9" fill="#0C0A07"/>`;
  const col=(x,w,top,g)=>
    `<rect x="${R2(x)}" y="${R2(top)}" width="${R2(w)}" height="${R2(716-top)}" fill="${g?'url(#gCol)':MID}" opacity="${g?.62:.38}"/>`+
    `<rect x="${R2(x)}" y="${R2(top)}" width="${R2(w)}" height="${R2(716-top)}" fill="none" stroke="${HL}" stroke-width=".7" opacity=".4"/>`;
  [1,-1].forEach(sg=>{
    const b=CX+sg*54, x0=sg>0?b:b-26;
    s+=col(x0,26,268,true)+col(sg>0?b+31:b-42,11,292,false)+col(sg>0?b+47:b-63,7,316,false);
    s+=`<path d="M${R2(x0-4)} 268 L${R2(x0+30)} 268 L${R2(x0+30)} 260 L${R2(x0+24)} 260 L${R2(x0+24)} 252 L${R2(x0+2)} 252 L${R2(x0+2)} 260 L${R2(x0-4)} 260 Z" fill="${MID}" opacity=".7"/>`;
  });
  [[300,3.2,.8],[311,1.1,.45],[322,1.1,.3]].forEach(([y,w,o])=>{
    s+=`<path d="M10 ${y} L362 ${y}" stroke="${w>2?HL:MID}" stroke-width="${w}" opacity="${o}"/>`;});
  for(let i=0;i<17;i++){
    const a=(20+i*8.75)*D, r1=i%2?400:320;
    s+=`<path d="M${R2(CX+46*Math.cos(a))} ${R2(CY+46*Math.sin(a))} L${R2(CX+r1*Math.cos(a))} ${R2(CY+r1*Math.sin(a))}" `+
       `stroke="${MID}" stroke-width="${i%4===0?1.5:0.8}" opacity="${i%4===0?.45:.26}"/>`;
  }
  s+=`<path d="M${CX-30} 662 L${CX} 716 L${CX+30} 662 L${CX+20} 662 L${CX} 700 L${CX-20} 662 Z" fill="${MID}" opacity=".7"/>`;
  [[7,1.6,.8],[13,0.9,.45],[19,0.9,.28]].forEach(([m,w,o])=>{
    s+=`<rect x="${m}" y="${m}" width="${W-m*2}" height="${Hh-m*2}" fill="none" stroke="${o>.7?HL:MID}" stroke-width="${w}" opacity="${o}"/>`;});
  [[7,7,1,1],[W-7,7,-1,1],[7,Hh-7,1,-1],[W-7,Hh-7,-1,-1]].forEach(([x,y,sx,sy])=>{
    s+=`<path d="M${R2(x+sx*4)} ${R2(y+sy*40)} L${R2(x+sx*4)} ${R2(y+sy*26)} L${R2(x+sx*14)} ${R2(y+sy*26)} `+
       `L${R2(x+sx*14)} ${R2(y+sy*14)} L${R2(x+sx*26)} ${R2(y+sy*14)} L${R2(x+sx*26)} ${R2(y+sy*4)} L${R2(x+sx*40)} ${R2(y+sy*4)}" `+
       `fill="none" stroke="${HL}" stroke-width="1.7" opacity=".75"/>`;});
  return {vb:`0 0 ${W} ${Hh}`,par:'xMidYMin slice',body:s};
}

/* ---- Domain: shrine of bone, crimson dark, neon ---- */
function bgDomain(){
  const W=372,Hh=760;
  const BLOOD='#E01F35',OX='#7A0C1C',NEON='#2FE0D0',BONE='#E8DCC8',BONE2='#6E5F50';
  let s=`<defs>
    <linearGradient id="dSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141A33"/><stop offset="55%" stop-color="#1A0E1C"/><stop offset="100%" stop-color="#0D0508"/></linearGradient>
    <radialGradient id="dGlow" cx="50%" cy="60%" r="62%">
      <stop offset="0%" stop-color="${BLOOD}" stop-opacity=".6"/><stop offset="48%" stop-color="${OX}" stop-opacity=".32"/>
      <stop offset="100%" stop-color="${OX}" stop-opacity="0"/></radialGradient>
    <radialGradient id="dMouth" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="${NEON}" stop-opacity=".5"/><stop offset="100%" stop-color="${NEON}" stop-opacity="0"/></radialGradient>
    <linearGradient id="dRoof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A0A14"/><stop offset="100%" stop-color="#12060A"/></linearGradient>
  </defs>
  <rect width="${W}" height="${Hh}" fill="url(#dSky)"/>
  <ellipse cx="186" cy="430" rx="300" ry="330" fill="url(#dGlow)"/>`;
  [[6,120,34,240],[44,168,22,192],[70,96,30,264],[276,110,28,250],[308,150,26,210],[338,86,30,274]].forEach((t,ti)=>{
    s+=`<rect x="${t[0]}" y="${t[1]}" width="${t[2]}" height="${t[3]}" fill="#0F0A16" opacity=".9"/>`;
    for(let i=0;i<16;i++){
      const gx=t[0]+4+(i%3)*((t[2]-8)/2), gy=t[1]+10+Math.floor(i/3)*15;

    }
  });
  s+=`<path d="M296 44 A17 17 0 1 1 292 78 A13.5 13.5 0 1 0 296 44 Z" fill="#EFE6DC" opacity=".9"/>`;
  s+=`<path d="M186 96 C176 104 166 112 160 124 C170 120 178 116 186 110 C194 116 202 120 212 124 C206 112 196 104 186 96 Z" fill="${BLOOD}" opacity=".85"/>`;
  s+=`<path d="M160 124 C150 116 146 106 148 96 C156 104 160 112 162 120 Z" fill="${OX}"/>`;
  s+=`<path d="M212 124 C222 116 226 106 224 96 C216 104 212 112 210 120 Z" fill="${OX}"/>`;
  s+=`<circle cx="186" cy="126" r="5.5" fill="${NEON}" opacity=".7"/>`;
  const roof=(cx,y,w,h)=>{
    const d=`M${R2(cx-w)} ${R2(y+h)} C${R2(cx-w+10)} ${R2(y+h-9)} ${R2(cx-w*0.6)} ${R2(y+3)} ${R2(cx-w*0.3)} ${y} `+
            `L${R2(cx+w*0.3)} ${y} C${R2(cx+w*0.6)} ${R2(y+3)} ${R2(cx+w-10)} ${R2(y+h-9)} ${R2(cx+w)} ${R2(y+h)} `+
            `C${R2(cx+w*0.55)} ${R2(y+h+9)} ${R2(cx-w*0.55)} ${R2(y+h+9)} ${R2(cx-w)} ${R2(y+h)} Z`;
    return `<path d="${d}" fill="url(#dRoof)"/><path d="${d}" fill="none" stroke="${BLOOD}" stroke-width="1.5" opacity=".68"/>`;
  };
  s+=roof(186,132,66,26)+roof(186,182,110,32)+roof(186,242,158,38);
  s+=`<rect x="150" y="158" width="72" height="26" fill="#0B0409"/><rect x="118" y="214" width="136" height="30" fill="#0B0409"/>`;
  [166,186,206].forEach(x=>s+=`<rect x="${x-3}" y="162" width="6" height="18" fill="${NEON}" opacity=".45"/>`);
  [136,160,186,212,236].forEach(x=>s+=`<rect x="${x-3}" y="219" width="6" height="20" fill="${NEON}" opacity=".38"/>`);
  s+=`<path d="M56 286 L316 286 L302 470 L70 470 Z" fill="#160710"/>`;
  s+=`<path d="M56 286 L316 286 L302 470 L70 470 Z" fill="none" stroke="${OX}" stroke-width="1.6" opacity=".8"/>`;
  [86,120,252,286].forEach(x=>{
    s+=`<rect x="${x}" y="292" width="12" height="176" fill="#230A14"/>`;
    s+=`<rect x="${x}" y="292" width="12" height="176" fill="none" stroke="${BLOOD}" stroke-width=".9" opacity=".4"/>`;});
  s+=`<ellipse cx="186" cy="386" rx="96" ry="92" fill="url(#dMouth)"/>`;
  const MOUTH='M142 316 C160 306 212 306 230 316 C246 344 246 424 230 452 C212 462 160 462 142 452 C126 424 126 344 142 316 Z';
  s+=`<path d="${MOUTH}" fill="#07040A"/><path d="${MOUTH}" fill="none" stroke="${NEON}" stroke-width="1.4" opacity=".55"/>`;
  for(let i=0;i<9;i++){

    s+=`<path d="M${R2(x)} 318 L${R2(x+5.2)} 318 L${R2(x+2.6)} ${R2(332+(i%2?4:0))} Z" fill="${BONE}" opacity=".78"/>`;
    s+=`<path d="M${R2(x)} 450 L${R2(x+5.2)} 450 L${R2(x+2.6)} ${R2(436-(i%2?4:0))} Z" fill="${BONE}" opacity=".78"/>`;
  }
  const skull=(cx,cy,r,rot,op)=>`<g transform="translate(${cx} ${cy}) rotate(${rot})" opacity="${op}">`+
    `<path d="M${-r} 4 C${-r} ${-r*0.95} ${-r*0.5} ${-r*1.25} 0 ${-r*1.25} C${r*0.5} ${-r*1.25} ${r} ${-r*0.95} ${r} 4 `+
    `C${r} ${r*0.5} ${r*0.55} ${r*0.85} 0 ${r*0.85} C${-r*0.55} ${r*0.85} ${-r} ${r*0.5} ${-r} 4 Z" fill="${BONE2}"/>`+
    `<ellipse cx="${-r*0.42}" cy="${-r*0.28}" rx="${r*0.26}" ry="${r*0.3}" fill="#08050A"/>`+
    `<ellipse cx="${r*0.42}" cy="${-r*0.28}" rx="${r*0.26}" ry="${r*0.3}" fill="#08050A"/>`+

  const horn=(x,y,len,lean,op)=>`<path d="M${x} ${y} C${R2(x+lean*0.3)} ${R2(y-len*0.55)} ${R2(x+lean*0.85)} ${R2(y-len*0.85)} ${R2(x+lean)} ${R2(y-len)} `+

  s+=horn(24,548,86,34,.55)+horn(320,556,78,-30,.55)+horn(84,584,58,22,.42)+horn(268,592,52,-20,.42);
  s+=skull(52,556,25,-12,.55)+skull(126,536,31,6,.58)+skull(214,540,29,-8,.58)+skull(300,562,26,14,.55);
  s+=skull(88,624,22,18,.4)+skull(180,616,26,-4,.44)+skull(266,630,21,-16,.4);
  s+=skull(140,700,20,10,.3)+skull(232,708,19,-10,.3);
  for(let i=0;i<22;i++){
    const a=(-150+i*(120/21))*Math.PI/180;
    s+=`<path d="M${R2(186+70*Math.cos(a))} ${R2(430+70*Math.sin(a))} L${R2(186+460*Math.cos(a))} ${R2(430+460*Math.sin(a))}" `+
       `stroke="${BLOOD}" stroke-width="${i%4===0?1.2:0.6}" opacity="${i%4===0?0.18:0.1}"/>`;
  }
  [[8,300,4,58],[8,372,4,34],[360,318,4,46],[360,378,4,62]].forEach((r,i)=>{
    s+=`<rect x="${r[0]}" y="${r[1]}" width="${r[2]}" height="${r[3]}" fill="${i%2?BLOOD:NEON}" opacity=".5"/>`;});
  return {vb:`0 0 ${W} ${Hh}`,par:'xMidYMin slice',body:s};
}

const BACKDROPS={hanami:bgHanami, gilt:bgGilt, domain:bgDomain};
let _bgDrawn=null;
function applyTheme(id,opts){
  id=THEMES.some(t=>t.id===id)?id:'sunset';
  const root=document.documentElement;
  if(id==='sunset')root.removeAttribute('data-app'); else root.setAttribute('data-app',id);
  const host=document.getElementById('themebg');
  if(host){
    if(id==='sunset'){ host.innerHTML=''; _bgDrawn=null; }
    else if(_bgDrawn!==id){
      const d=BACKDROPS[id]();
      host.innerHTML=`<svg viewBox="${d.vb}" preserveAspectRatio="${d.par}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${d.body}</svg>`;
      _bgDrawn=id;
    }
  }
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.setAttribute('content',{sunset:'#FFD489',hanami:'#F7F1E6',gilt:'#0C0A07',domain:'#0D0508'}[id]);
  if(!opts||!opts.silent){ state.theme=id; save(); }
}
/* rotation: advance once the chosen span has elapsed, wall-clock based */
function rotationOf(){ return ROTATIONS.find(r=>r.id===state.themeRotate)||ROTATIONS[0]; }
function rotationDueAt(){
  const rot=rotationOf();
  if(!rot.mins)return null;
  return Number(state.themeRotateAt||0)+rot.mins*60000;
}
function checkThemeRotation(){
  const rot=rotationOf();
  if(!rot.mins)return false;
  const last=Number(state.themeRotateAt)||0;
  if(!last){ state.themeRotateAt=Date.now(); save(); return false; }
  if(Date.now()-last < rot.mins*60000) return false;
  const ids=THEMES.map(t=>t.id);
  const next=ids[(ids.indexOf(state.theme)+1)%ids.length];
  state.theme=next; state.themeRotateAt=Date.now(); save();
  applyTheme(next,{silent:true});
  return next;
}
/* keep it honest while the app is open, and on every return to it */
let _rotTimer=null;
function startRotationTimer(){
  if(_rotTimer)clearInterval(_rotTimer);
  _rotTimer=setInterval(()=>{
    if(document.visibilityState!=='visible')return;
    if(checkThemeRotation()){ if(typeof render==='function')render(); }
  },20000);
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&checkThemeRotation()){
    if(typeof render==='function')render();
  }
});
/* older builds stored a date string and day-based ids — normalise once */
(function migrateRotation(){
  if(typeof state.themeRotateAt==='string')state.themeRotateAt=Date.now();
  if(!ROTATIONS.some(r=>r.id===state.themeRotate))state.themeRotate='off';
})();
</script>
<div id="notifhost"></div>
<script>
'use strict';
/* ============================================================
   Notifications — one queue, an in-app bar, and a centre
   ============================================================ */

const NOTIF_KINDS={
  cadence:    {icon:'chart',  label:'Cadence'},
  daily:      {icon:'lifting',label:'Daily tasks'},
  sunday:     {icon:'scale',  label:'Sunday'},
  checkpoint: {icon:'camera', label:'Checkpoint'},
  reminder:   {icon:'bell',   label:'Reminder'},
};
const NOTIF_HOLD=5000;

/* every notification lands here first: logged, then queued for the bar */
function pushNotif({kind,hobby,title,body,page}){
  const n={id:uid(),ts:Date.now(),kind:kind||'reminder',hobby:hobby||null,
           title:title||'',body:body||'',page:page||null,read:false};
  state.notifLog.unshift(n);
  if(state.notifLog.length>120)state.notifLog.length=120;
  save();
  notifQueue.push(n);
  if(!notifShowing)nextNotif();
  fireNotification(n.title,n.body);   // the OS one, when permission allows
  return n;
}
let notifQueue=[], notifShowing=null, notifTimer=null;

function unreadNotifs(){return state.notifLog.filter(n=>!n.read).length;}
function notifIcon(n){
  if(n.hobby&&ICONS[n.hobby])return ICONS[n.hobby];
  const k=NOTIF_KINDS[n.kind];
  return ICONS[(k&&k.icon)||'bell']||ICONS.bell;
}
function notifTint(n){return n.hobby?htint(n.hobby):'var(--surface2)';}
function notifColor(n){return n.hobby?hcolor(n.hobby):'var(--accent)';}

function nextNotif(){
  const host=$('#notifhost');
  if(!host)return;
  if(!notifQueue.length){ notifShowing=null; host.innerHTML=''; return; }
  const n=notifQueue.shift();
  notifShowing=n;
  host.innerHTML=`<div class="notifbar" role="status">
    <div class="nb-in">
      <span class="nb-ic" style="background:${notifTint(n)};color:${notifColor(n)}">${notifIcon(n)}</span>
      <span class="nb-tx" data-nb-open>
        <span class="nb-t">${esc(n.title)}</span>
        <span class="nb-b">${esc(n.body)}</span>
      </span>
      <button class="nb-x" data-nb-close aria-label="Dismiss">${ICONS.close}</button>
    </div>
    <div class="nb-timer"><i></i></div>
  </div>`;
  const bar=host.querySelector('.notifbar');
  const dismiss=(opened)=>{
    clearTimeout(notifTimer); notifTimer=null;
    bar.classList.remove('show');
    const rec=state.notifLog.find(x=>x.id===n.id);
    if(rec&&opened){rec.read=true;save();}
    setTimeout(()=>{ notifShowing=null; nextNotif(); if(opened)render(); },260);
  };
  bar.querySelector('[data-nb-close]').addEventListener('click',e=>{e.stopPropagation();dismiss(false);});
  bar.querySelector('[data-nb-open]').addEventListener('click',()=>{
    const rec=state.notifLog.find(x=>x.id===n.id);
    if(rec){rec.read=true;save();}
    openNotifTarget(n);
    dismiss(true);
  });
  requestAnimationFrame(()=>{ bar.classList.add('show'); bar.classList.add('run'); });
  notifTimer=setTimeout(()=>dismiss(false),NOTIF_HOLD);
}
/* where a notification takes you when tapped */
function openNotifTarget(n){
  closeSheet(true);
  if(n.page&&PAGES[n.page]){ viewStack.length=0; view={tab:'dash',page:n.page}; }
  else if(n.hobby&&PAGES[n.hobby]){ viewStack.length=0; view={tab:'dash',page:n.hobby}; }
  else if(n.kind==='cadence'){ viewStack.length=0; view={tab:'stats',page:null}; }
  else if(n.kind==='reminder'){ viewStack.length=0; view={tab:'cal',page:null}; }
  else { viewStack.length=0; view={tab:'dash',page:'lifting'}; }
  window.scrollTo(0,0);
}
function relTime(ts){
  const mins=Math.round((Date.now()-ts)/60000);
  if(mins<1)return 'just now';
  if(mins<60)return mins+'m ago';
  const h=Math.round(mins/60);
  if(h<24)return h+'h ago';
  const d=Math.round(h/24);
  return d===1?'yesterday':d+'d ago';
}

/* ---------- notification centre ---------- */
SHEETS['notif-center']=()=>{
  const list=state.notifLog;
  const rows=list.length?list.slice(0,40).map(n=>`
    <button class="nrow ${n.read?'':'unread'}" data-nopen="${n.id}">
      <span class="nic" style="background:${notifTint(n)};color:${notifColor(n)}">${notifIcon(n)}</span>
      <span class="nmain">
        <span class="nt">${esc(n.title)}</span>
        <span class="nb">${esc(n.body)}</span>
        <span class="nw">${(NOTIF_KINDS[n.kind]||{}).label||''} · ${relTime(n.ts)}</span>
      </span>
    </button>`).join(''):'<div class="empty">Nothing yet — nudges land here</div>';

  const perm=(typeof Notification!=='undefined')?Notification.permission:'unsupported';
  const row=(k,title,desc)=>`<div class="switchrow">
    <div class="main"><div style="font-weight:700;font-size:14.5px">${title}</div>
      <div class="s" style="font-size:12.5px;color:var(--ink2)">${desc}</div></div>
    <span class="switch ${state.notify[k]!==false?'on':''}" data-ntoggle="${k}"><i></i></span></div>`;

  openSheet({title:'Notifications',
    body:`<div class="seg" id="nseg">
        <button class="on" data-nt="feed">Recent</button>
        <button data-nt="set">Settings</button>
      </div>
      <div id="nfeed">
        ${list.length?`<div style="display:flex;justify-content:flex-end;margin-bottom:2px">
          <button class="btn line sm" id="n-clear" style="width:auto;padding:6px 12px">Clear all</button></div>`:''}
        <div class="rowlist">${rows}</div>
      </div>
      <div id="nset" class="hidden">
        <div class="switchrow">
          <span style="color:var(--ink2);display:flex">${ICONS.bell}</span>
          <div class="main"><div style="font-weight:700;font-size:14.5px">Notifications</div>
            <div class="s" style="font-size:12.5px;color:var(--ink2)">${state.notify.enabled?(perm==='granted'?'On — also shown on your lock screen':'On in-app'):'Off'}</div></div>
          <span class="switch ${state.notify.enabled?'on':''}" id="notif-main"><i></i></span></div>
        <hr class="hr">
        ${row('reminders','Calendar reminders','When something you scheduled comes due')}
        ${row('cadence','Hobby cadence','When a hobby drops below its range — or runs ahead of it')}
        ${row('daily','Daily tasks','When yesterday’s checklist was left unfinished')}
        ${row('sunday','Sunday tasks','Waist measurement and the week’s weight average')}
        ${row('checkpoints','Checkpoints','Weeks 4, 8, 12 and 16')}
      </div>`,
    onMount(el){
      el.querySelectorAll('#nseg button').forEach(b=>b.addEventListener('click',()=>{
        el.querySelectorAll('#nseg button').forEach(x=>x.classList.toggle('on',x===b));
        el.querySelector('#nfeed').classList.toggle('hidden',b.dataset.nt!=='feed');
        el.querySelector('#nset').classList.toggle('hidden',b.dataset.nt!=='set');
      }));
      el.querySelectorAll('[data-nopen]').forEach(b=>b.addEventListener('click',()=>{
        const n=state.notifLog.find(x=>x.id===b.dataset.nopen); if(!n)return;
        n.read=true; save(); closeSheet(true); openNotifTarget(n); render();
      }));
      const clr=el.querySelector('#n-clear');
      if(clr)clr.addEventListener('click',()=>{state.notifLog=[];save();closeSheet(true);SHEETS['notif-center']();render();});
      const main=el.querySelector('#notif-main');
      main.addEventListener('click',function(){
        if(state.notify.enabled){state.notify.enabled=false;save();this.classList.remove('on');render();}
        else enableNotifications().then(()=>{this.classList.add('on');checkCadence();render();});
      });
      el.querySelectorAll('[data-ntoggle]').forEach(s=>s.addEventListener('click',function(){
        const k=this.dataset.ntoggle;
        state.notify[k]=state.notify[k]===false;
        this.classList.toggle('on',state.notify[k]!==false);
        save();
      }));
      // mark everything seen once the centre has been opened
      setTimeout(()=>{state.notifLog.forEach(n=>n.read=true);save();},900);
    }});
};
</script>
<script>
'use strict';
/* ============================================================
   Rendering — shell, dashboard, film / reading / drawing / music / closet
   ============================================================ */

const SHOWN={};
let readFilter='all', readYear='all', readQ='';
let vinylFilter='all', vinylYear='all', vinylQ='';
let listenView='list', vinylView='list';
let journalQ='', journalMonth='all';
let restQ='', restFilter='all', restLoc='all';
let closetFilter={jackets:'All',pants:'All',shirts:'All'};
const CLOSET_CATS={
  jackets:{name:'Jackets',subs:['Sweatshirt','Bomber','Sweater','Shell']},
  pants:{name:'Pants',subs:['Canvas','Denim','Sweatpants','Linen']},
  shirts:{name:'Shirts',subs:['Polo','Button-up','Tee','Long sleeve']},
};

function sliceList(key,arr,renderItem,emptyHtml){
  const n=SHOWN[key]||3;
  const shown=arr.slice(0,n).map(renderItem).join('');
  const hidden=Math.max(0,arr.length-n);

  if(hidden>0||n>3){

    if(n>3)btns+=`<button class="showmore" data-less="${key}">Hide</button>`;
    btns+='</div>';
  }
  return (arr.length?shown:emptyHtml)+btns;
}
function ratingOptions(current){
  return ['all',5,4.5,4,3.5,3,2.5,2,1.5,1,0.5].map(v=>
    `<option value="${v}" ${String(current)===String(v)?'selected':''}>${v==='all'?'All ratings':v+' ★'}</option>`).join('');
}
function yearsFrom(arr){
  return [...new Set(arr.map(x=>String(x.date||'').slice(0,4)).filter(Boolean))].sort().reverse();
}
function yearOptions(years,current){
  return `<option value="all" ${current==='all'?'selected':''}>All years</option>`+

}
function searchBar(id,val,ph){

}
function viewToggle(id,cur){

function render(){
  renderTabbar();
  const app=$('#app');
  if(view.page) app.innerHTML=(PAGES[view.page]||pageDash)();
  else if(view.tab==='cal') app.innerHTML=pageCalendar();
  else if(view.tab==='stats') app.innerHTML=pageAnalytics();

}
function renderTabbar(){
  const tabs=[['dash','Dashboard',ICONS.grid],['cal','Calendar',ICONS.cal],['stats','Analytics',ICONS.chart]];
  $('#tabbar').innerHTML=tabs.map(([k,n,ic])=>
    `<button data-tab="${k}" class="${view.tab===k&&!view.page?'on':''}" aria-label="${n}">${ic}<span>${n}</span></button>`).join('');
  $('#tabbar').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
    viewStack.length=0; view={tab:b.dataset.tab,page:null}; render(); window.scrollTo(0,0);
  }));
}

function wire(root){
  root.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>go({tab:view.tab,page:el.dataset.open})));
  root.querySelectorAll('[data-back]').forEach(el=>el.addEventListener('click',back));
  root.querySelectorAll('[data-dellog]').forEach(el=>el.addEventListener('click',()=>{delLog(el.dataset.dellog);render();toast('Removed');}));
  root.querySelectorAll('[data-adjust]').forEach(el=>el.addEventListener('click',()=>adjustSheet(el.dataset.adjust,el.dataset.label,Number(el.dataset.current))));
  root.querySelectorAll('[data-sheet]').forEach(el=>el.addEventListener('click',()=>SHEETS[el.dataset.sheet]&&SHEETS[el.dataset.sheet](el.dataset.arg)));
  root.querySelectorAll('[data-more]').forEach(el=>el.addEventListener('click',()=>{SHOWN[el.dataset.more]=(SHOWN[el.dataset.more]||3)+10;render();}));
  root.querySelectorAll('[data-less]').forEach(el=>el.addEventListener('click',()=>{SHOWN[el.dataset.less]=3;render();}));
  root.querySelectorAll('[data-view]').forEach(el=>el.addEventListener('click',()=>{
    const [which,mode]=el.dataset.view.split('|');
    if(which==='listen')listenView=mode; else if(which==='vinyl')vinylView=mode;
    render();
  }));
  root.querySelectorAll('[data-pin]').forEach(el=>el.addEventListener('click',()=>{
    const b=state.reading.toRead.find(x=>x.id===el.dataset.pin); if(!b)return;
    if(!b.pinned&&state.reading.toRead.filter(x=>x.pinned).length>=3){toast('Top 3 is full — unpin one first');return;}
    b.pinned=!b.pinned; save(); render();
  }));
  root.querySelectorAll('[data-jpin]').forEach(el=>el.addEventListener('click',()=>{
    const l=state.logs.find(x=>x.id===el.dataset.jpin); if(!l)return;
    if(!l.pinned&&logs('journal','entry').filter(x=>x.pinned).length>=10){toast('You can pin up to 10 entries');return;}
    l.pinned=!l.pinned; save(); render();
  }));
  root.querySelectorAll('[data-regular]').forEach(el=>el.addEventListener('click',()=>{
    const r=state.cooking.restaurants.find(x=>x.id===el.dataset.regular); if(!r)return;
    r.regular=!r.regular; save(); render();
    toast(r.regular?'Marked as a regular ⭐':'Removed from regulars');
  }));
  root.querySelectorAll('[data-cf]').forEach(el=>el.addEventListener('click',()=>{
    const [cat,sub]=el.dataset.cf.split('|'); closetFilter[cat]=sub; render();
  }));
  const bind=(sel,fn,evt)=>{const e=root.querySelector(sel); if(e)e.addEventListener(evt||'change',()=>fn(e.value));};
  bind('#read-filter',v=>{readFilter=v;SHOWN['read']=3;render();});
  bind('#read-year',v=>{readYear=v;SHOWN['read']=3;render();});
  bind('#read-q',v=>{readQ=v;SHOWN['read']=3;rerender('#read-list',readListHtml());},'input');
  bind('#vinyl-filter',v=>{vinylFilter=v;SHOWN['vinyl']=3;render();});
  bind('#vinyl-year',v=>{vinylYear=v;SHOWN['vinyl']=3;render();});
  bind('#vinyl-q',v=>{vinylQ=v;SHOWN['vinyl']=3;rerender('#vinyl-list',vinylListHtml());},'input');
  bind('#rest-q',v=>{restQ=v;SHOWN['restRated']=3;rerender('#rest-list',restListHtml());},'input');
  bind('#rest-filter',v=>{restFilter=v;SHOWN['restRated']=3;render();});
  bind('#rest-loc',v=>{restLoc=v;SHOWN['restRated']=3;render();});
  bind('#jq',v=>{journalQ=v;rerender('#jlist',journalEntriesHtml());},'input');
  bind('#jmonth',v=>{journalMonth=v;render();});
  wireStars(root); wireRich(root);
}

/* ---------- rating distribution (Letterboxd-style column chart) ---------- */
function ratingChart(items,color){
  const buckets=[0.5,1,1.5,2,2.5,3,3.5,4,4.5,5];
  const counts=buckets.map(b=>items.filter(i=>Number(i.rating)===b).length);
  const max=Math.max(1,...counts);
  const W=520,Hh=170,padL=6,padR=6,base=Hh-30;
  const slot=(W-padL-padR)/buckets.length;
  let bars='',labels='';
  counts.forEach((c,i)=>{
    const h=c/max*(base-22);
    const bw=slot*0.62;
    const x=padL+i*slot+(slot-bw)/2;
    const y=base-h;
    bars+=`<rect class="bar" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h,c?3:1).toFixed(1)}" fill="${c?color:'var(--line)'}" opacity="${c?1:.55}"><title>${buckets[i]} stars: ${c}</title></rect>`;
    if(c)bars+=`<text x="${(x+bw/2).toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--ink2)">${c}</text>`;
    const cx=padL+i*slot+slot/2;
    labels+=`<text x="${cx.toFixed(1)}" y="${Hh-13}" text-anchor="middle" font-size="10" fill="var(--ink3)">${buckets[i]}</text>`;
  });
  return `<div class="chartwrap"><svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Ratings distribution">
    <line x1="${padL}" y1="${base}" x2="${W-padR}" y2="${base}" stroke="var(--line)" stroke-width="1"/>
    ${bars}${labels}
    <text x="${W/2}" y="${Hh-1}" text-anchor="middle" font-size="9.5" fill="var(--ink3)">rating</text>
  </svg></div>`;
}
