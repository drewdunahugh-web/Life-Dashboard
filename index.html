<script>
'use strict';
/* ============================================================
   Pages — lifting protocol, golf, skiing, cooking, tennis, journal
   ============================================================ */

/* ---------- lifting: program data ---------- */
function exData(cycle,d,e){
  const c=state.lifting.data['c'+cycle]||{};
  return (c[d]&&c[d][e])||{};
}
function setExData(cycle,d,e,patch){
  const key='c'+cycle;
  if(!state.lifting.data[key])state.lifting.data[key]={};
  if(!state.lifting.data[key][d])state.lifting.data[key][d]={};
  state.lifting.data[key][d][e]={...state.lifting.data[key][d][e],...patch};
  save();
}
function exVol(x){return (Number(x.sets)||0)*(Number(x.reps)||0)*(Number(x.weight)||0);}
function dayVolume(cycle,d){return PROGRAM_DAYS[d].ex.reduce((a,_,e)=>a+exVol(exData(cycle,d,e)),0);}
function cycleVolume(c){return PROGRAM_DAYS.reduce((a,_,d)=>a+dayVolume(c,d),0);}

/* ---------- lifting: protocol helpers ---------- */
function protoWeek(){
  if(!state.protocol.startDate)return null;
  return Math.floor(daysBetween(state.protocol.startDate,todayStr())/7)+1;
}
/* the block splits: cut through week 10, then maintenance while training holds */
function protoPhase(wk){
  const w=wk||protoWeek()||1;
  return w<=PROTO.cutWeeks
    ? {id:'cut',   name:'Cut',         ...PROTO.cut}
    : {id:'maint', name:'Maintenance', ...PROTO.maint};
}
function protoWeekStart(w){
  const d=parseD(state.protocol.startDate);
  d.setDate(d.getDate()+(w-1)*7);
  return d;
}
function protoWeekDates(w){
  const s=protoWeekStart(w);
  return Array.from({length:7},(_,i)=>{const d=new Date(s);d.setDate(d.getDate()+i);return dstr(d);});
}
function protoDay(dateStr){ return state.protocol.daily[dateStr||todayStr()]||{}; }
function setProtoDay(patch,dateStr){
  const k=dateStr||todayStr();
  state.protocol.daily[k]={...state.protocol.daily[k],...patch};
  save();
}
function weekWeights(w){
  return protoWeekDates(w).map(d=>{
    const v=state.protocol.daily[d];
    return v&&v.weight?Number(v.weight):null;
  });
}
function weekWeightAvg(w){
  const vals=weekWeights(w).filter(v=>v!=null);
  return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null;
}
function weekComplete(w){
  if(!state.protocol.startDate)return false;
  const dates=protoWeekDates(w);
  return dates[6]<todayStr();
}
function latestWeight(){
  const e=Object.entries(state.protocol.daily).filter(([,v])=>v&&v.weight).sort((a,b)=>a[0]<b[0]?1:-1);
  return e.length?{date:e[0][0],w:Number(e[0][1].weight)}:null;
}
function weekDrinks(w){ return Number(state.protocol.drinks['w'+w])||0; }
function setWeekDrinks(w,n){
  state.protocol.drinks['w'+w]=Math.max(0,n);
  save();
}

/* ---------- line chart ---------- */
function lineChart(points,color,opts={}){
  // points: [{x:label, y:number|null}]
  const W=520,Hh=150,padL=34,padR=10,padT=14,padB=24;
  const vals=points.map(p=>p.y).filter(v=>v!=null);
  if(!vals.length)return `<div class="empty">No data yet</div>`;
  let min=Math.min(...vals),max=Math.max(...vals);
  if(min===max){min-=1;max+=1;}
  const pad=(max-min)*0.15; min-=pad; max+=pad;
  const X=i=>padL+(points.length<=1?0:(i/(points.length-1))*(W-padL-padR));
  const Y=v=>padT+(1-(v-min)/(max-min))*(Hh-padT-padB);
  let d='',dots='',first=true;
  points.forEach((p,i)=>{
    if(p.y==null)return;
    const x=X(i),y=Y(p.y);
    d+=(first?'M':'L')+x.toFixed(1)+' '+y.toFixed(1)+' ';
    first=false;
    dots+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.4" fill="${color}" stroke="var(--surface)" stroke-width="1.6"><title>${p.x}: ${p.y}${opts.unit||''}</title></circle>`;
  });
  const gridY=[min+(max-min)*0.15,max-(max-min)*0.15];
  const grid=gridY.map(v=>`<line x1="${padL}" y1="${Y(v).toFixed(1)}" x2="${W-padR}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
    <text x="${padL-5}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end" font-size="9.5" fill="var(--ink3)">${v.toFixed(1)}</text>`).join('');
  const ticks=points.map((p,i)=>(i===0||i===points.length-1||points.length<=6)
    ?`<text x="${X(i).toFixed(1)}" y="${Hh-6}" text-anchor="middle" font-size="9.5" fill="var(--ink3)">${p.x}</text>`:'').join('');
  return `<div class="chartwrap"><svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Trend">
    ${grid}<path d="${d.trim()}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>${dots}${ticks}
  </svg></div>`;
}

/* ---------- LIFTING PAGE ---------- */
function pageLifting(){
  const wk=protoWeek();
  const cyc=state.lifting.cycle;
  const trained=liveLogs('lifting','workout').filter(l=>parseD(l.date)>=startOfWeek(new Date())).length;
  const today=protoDay();
  const setupDone=SETUP_ITEMS.every(i=>state.protocol.setup[i.k]);

  const ph=protoPhase(wk||1);
  let head;
  if(!wk){
    head=`<div class="protohead">
      <div class="wk">16-week protocol</div>
      <div class="big">Not started</div>
      <div class="sub2">${PROTO.startWeight} lb → ${PROTO.targetLo}–${PROTO.targetHi} lb · cut ${PROTO.cutWeeks} weeks, then hold</div>
    </div>
    <button class="btn" data-sheet="proto-start" style="margin-bottom:14px">${ICONS.plus} Start the protocol</button>`;
  }else{
    const pct=Math.max(0,Math.min(100,(daysBetween(state.protocol.startDate,todayStr())/(PROTO.weeks*7))*100));
    const cutPct=(PROTO.cutWeeks/PROTO.weeks)*100;
    const done=wk>PROTO.weeks;
    head=`<div class="protohead">
      <div class="wk">${done?'Protocol complete':ph.name+(ph.id==='cut'?` · week ${wk} of ${PROTO.cutWeeks}`:` · week ${wk} of ${PROTO.weeks}`)}</div>
      <div class="big">${done?'Week 16 done':'Week '+wk+' of '+PROTO.weeks}</div>
      <div class="sub2">${ph.kcal.toLocaleString()} kcal · train ${PROTO.trainDays} · floor ${PROTO.floor} lb</div>
      <div class="protobar"><i style="width:${pct.toFixed(1)}%"></i>
        <span style="position:absolute"></span></div>
      <div style="position:relative;height:0">
        <span style="position:absolute;left:${cutPct.toFixed(1)}%;top:-9px;width:2px;height:7px;background:rgba(255,255,255,.75);border-radius:1px"></span>
      </div>
    </div>`;
  }

  const setupCard=setupDone?'':`<div class="card">
    <h2><span class="grow">One-time setup</span><span class="badge">${SETUP_ITEMS.filter(i=>state.protocol.setup[i.k]).length}/${SETUP_ITEMS.length}</span></h2>
    ${SETUP_ITEMS.map(i=>`
      <button class="chk ${state.protocol.setup[i.k]?'on':''}" data-setup="${i.k}" style="width:100%;text-align:left">
        <span class="box">${ICONS.check}</span><span class="t">${esc(i.t)}</span>
      </button>`).join('')}
  </div>`;

  const dailyCard=`<div class="card">
    <h2><span class="grow">Today</span><span class="badge">${DAILY_ITEMS.filter(i=>today[i.k]).length+(today.weight?1:0)}/${DAILY_ITEMS.length+1}</span></h2>
    ${DAILY_ITEMS.map(i=>`
      <button class="chk ${today[i.k]?'on':''}" data-daily="${i.k}" style="width:100%;text-align:left">
        <span class="box">${ICONS.check}</span><span class="t">${esc(i.t)}</span>
      </button>`).join('')}
    <button class="chk ${today.weight?'on':''}" data-sheet="proto-weigh" style="width:100%;text-align:left">
      <span class="box">${ICONS.check}</span><span class="t">Weigh in</span>
      <span class="v">${today.weight?today.weight+' lb':'log'}</span>
    </button>
    <div class="macros">
      <div class="macro"><div class="k">${ph.protein}g</div><div class="l">protein</div></div>
      <div class="macro"><div class="k">${ph.carbs}g</div><div class="l">carbs</div></div>
      <div class="macro"><div class="k">${ph.fat}g</div><div class="l">fat</div></div>
    </div>
    <div class="row" style="border:none;padding:8px 0 0">
      <div class="main"><div class="t">${ph.name} target</div></div>
      <span class="num">${ph.kcal.toLocaleString()} kcal</span>
    </div>
  </div>`;

  /* ---- weight: current week daily, past weeks collapsed to averages ---- */
  let weightCard='';
  if(wk){
    const shownWeek=Math.min(wk,PROTO.weeks);
    const pastRows=[];
    for(let w=1;w<shownWeek;w++){
      const avg=weekWeightAvg(w);
      const prev=w>1?weekWeightAvg(w-1):null;
      const d=(avg!=null&&prev!=null)?avg-prev:null;
      pastRows.push(`<div class="row"><div class="main"><div class="t">Week ${w}</div></div>
        ${d!=null?`<span class="num ${d<0?'dl down':'dl up'}">${d>0?'+':''}${d.toFixed(1)}</span>`:''}
        <span class="num">${avg!=null?avg.toFixed(1)+' lb':'—'}</span></div>`);
    }
    const dates=protoWeekDates(shownWeek);
    const dayRows=dates.map((ds,i)=>{
      const v=state.protocol.daily[ds];
      const future=ds>todayStr();
      return `<div class="row">
        <div class="main"><div class="t">${parseD(ds).toLocaleDateString(undefined,{weekday:'short'})}</div>
          <div class="s">${fmtDate(ds)}</div></div>
        <input data-wday="${ds}" type="number" inputmode="decimal" value="${v&&v.weight?v.weight:''}"
          placeholder="${future?'—':'lb'}" ${future?'disabled':''}
          style="width:88px;text-align:center;padding:7px 4px;border-radius:9px;font-variant-numeric:tabular-nums">
      </div>`;
    }).join('');
    const curAvg=weekWeightAvg(shownWeek);
    /* weekly averages once there are two; before that, plot the daily weigh-ins */
    const wkPts=[];
    for(let w=1;w<=Math.min(wk,PROTO.weeks);w++){
      const a=weekWeightAvg(w);
      if(a!=null)wkPts.push({x:'W'+w,y:Number(a.toFixed(1))});
    }
    let chart='', chartLabel='';
    if(wkPts.length>1){
      chart=lineChart(wkPts,hcolor('lifting'),{unit:' lb'});
      chartLabel='Weekly averages';
    }else{
      const dayPts=Object.entries(state.protocol.daily)
        .filter(([d,v])=>v&&v.weight&&d>=state.protocol.startDate)
        .sort((a,b)=>a[0]<b[0]?-1:1)
        .map(([d,v])=>({x:parseD(d).toLocaleDateString(undefined,{month:'numeric',day:'numeric'}),y:Number(v.weight)}));
      if(dayPts.length>1){ chart=lineChart(dayPts,hcolor('lifting'),{unit:' lb'}); chartLabel='Daily weigh-ins'; }
      else if(dayPts.length===1){ chartLabel='One more weigh-in and the trend line starts'; }
      else { chartLabel='Log a weigh-in to start the trend'; }
    }
    weightCard=`<div class="card">
      <h2><span class="grow">Weight</span><span class="badge">${curAvg!=null?curAvg.toFixed(1)+' lb avg':'week '+shownWeek}</span></h2>
      ${chart?`<div style="font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:4px">${chartLabel}</div>${chart}<hr class="hr">`
             :`<div class="empty" style="padding:6px 0 12px">${chartLabel}</div>`}
      ${pastRows.length?`<div class="rowlist">${pastRows.join('')}</div><hr class="hr">`:''}
      <div class="rowlist">${dayRows}</div>
    </div>`;
  }

  /* ---- waist: one entry per week + line ---- */
  let waistCard='';
  if(wk){
    const upto=Math.min(wk,PROTO.weeks);
    const rows=[];
    for(let w=upto;w>=1;w--){
      const v=state.protocol.weeklyWaist[w];
      rows.push(`<div class="row"><div class="main"><div class="t">Week ${w}</div></div>
        <input data-waistwk="${w}" type="number" inputmode="decimal" value="${v!=null?v:''}" placeholder="in"
          style="width:88px;text-align:center;padding:7px 4px;border-radius:9px;font-variant-numeric:tabular-nums"></div>`);
    }
    const pts=[];
    for(let w=1;w<=upto;w++){
      const v=state.protocol.weeklyWaist[w];
      if(v!=null)pts.push({x:'W'+w,y:Number(v)});
    }
    waistCard=`<div class="card">
      <h2><span class="grow">Waist</span><span class="badge">Sunday</span></h2>
      <div class="rowlist">${sliceList('waistwk',rows,r=>r,'')}</div>
      ${pts.length>1?lineChart(pts,hcolor('skiing'),{unit:'"'}):''}
    </div>`;
  }

  /* ---- alcohol: only from week 5 ---- */
  let alcoholCard='';
  if(wk&&wk>PROTO.alcohol.dryWeeks){
    const n=weekDrinks(wk);
    const over=n>PROTO.alcohol.perWeek;
    alcoholCard=`<div class="card">
      <h2><span class="grow">Alcohol</span><span class="badge" style="${over?'color:var(--danger)':''}">${n}/${PROTO.alcohol.perWeek}</span></h2>
      <div class="row" style="border:none;padding:2px 0">
        <div class="main"><div class="t">Drinks this week</div></div>
        <button class="iconbtn" data-drink="-1" aria-label="One fewer">${ICONS.chevD.replace('<svg','<svg style="transform:rotate(0deg)"')}</button>
        <span class="num" style="font-size:20px;min-width:28px;text-align:center">${n}</span>
        <button class="iconbtn" data-drink="1" aria-label="One more">${ICONS.chevD.replace('<svg','<svg style="transform:rotate(180deg)"')}</button>
      </div>
    </div>`;
  }

  const days=PROGRAM_DAYS.map((day,d)=>{
    const vol=dayVolume(cyc,d);
    const done=liveLogs('lifting','workout').some(l=>l.cycle===cyc&&l.day===d);
    return `<div class="row" data-sheet="lift-day" data-arg="${d}" role="button" style="cursor:pointer">
      <div class="main"><div class="t">${esc(day.title)} ${done?'<span style="color:var(--good)">✓</span>':''}</div>
      <div class="s">${day.ex.length} exercises</div></div>
      <span class="num">${vol?vol.toLocaleString():''}</span>${ICONS.chevR.replace('<svg','<svg width="18" height="18" style="color:var(--ink3)"')}
    </div>`;
  }).join('');
  const cycVals=Array.from({length:N_CYCLES},(_,i)=>cycleVolume(i+1));
  const cycLabels=Array.from({length:N_CYCLES},(_,i)=>String(i+1));

  const cptCard=`<div class="card"><h2>Checkpoints</h2>
    ${PROTO.checkpoints.map(w=>{
      const c=state.protocol.checkpoints[w]||{};
      const reached=wk!=null&&wk>=w;
      return `<div class="cptrow ${c.done?'done':''}" data-sheet="proto-checkpoint" data-arg="${w}" role="button" style="cursor:pointer">
        <span class="wkb"><small>wk</small>${w}</span>
        <div class="main"><div class="t">${w===16?'Final measurements':'Photos · waist trend'}</div>
          <div class="s">${c.done?'done '+(c.date?fmtDate(c.date):''):reached?'due now':'upcoming'}</div></div>
        ${ICONS.chevR.replace('<svg','<svg width="18" height="18" style="color:var(--ink3)"')}
      </div>`;}).join('')}
  </div>`;

  return backBar('Lifting + Dieting','lifting')+head+`
    ${linkBtn('https://www.myfitnesspal.com','Open MyFitnessPal','lifting','cooking')}
    ${setupCard}
    ${dailyCard}
    <div class="card"><h2><span class="grow">Training</span><span class="badge">${trained}/4 this week</span></h2>
      <div class="seg" id="cycseg">${Array.from({length:N_CYCLES},(_,i)=>`<button data-cyc="${i+1}" class="${cyc===i+1?'on':''}">C${i+1}</button>`).join('')}</div>
      <div class="rowlist">${days}</div>
    </div>
    <div class="card"><h2>Cycle volume</h2>${barChart(cycVals,cycLabels,hcolor('lifting'),{allTicks:true})}</div>
    ${weightCard}
    ${waistCard}
    ${alcoholCard}
    ${cptCard}
    <div class="card"><h2>Every session</h2>
      <ul class="rules">
        <li>Compounds <b>1–2 RIR</b> · isolation <b>0–1 RIR on the last set only</b></li>
        <li>No sets to mechanical failure</li>
        <li>Log weight, reps and RIR on every set</li>
        <li>Hit the top of the rep range on all sets → add weight, drop to the bottom</li>
      </ul>
    </div>`;
}

/* ---------- GOLF ---------- */
function coursePars(courseId){
  const c=state.golf.courses.find(x=>x.id===courseId);
  return (c&&c.pars)||{};
}
function holesFor(kind){
  if(kind==='front')return Array.from({length:9},(_,i)=>i+1);
  if(kind==='back')return Array.from({length:9},(_,i)=>i+10);
  return Array.from({length:18},(_,i)=>i+1);
}
function roundTotals(log){
  const holes=holesFor(log.holes||'full');
  let par=0,strokes=0,score=0,played=0;
  holes.forEach(h=>{
    const p=Number((log.pars||{})[h])||0;
    const s=Number((log.byHole||{})[h])||0;
    par+=p;
    if(s){ strokes+=s; score+=s-p; played++; }
  });
  return {par,strokes,score,played,holes:holes.length};
}
function pageGolf(){
  const rounds=logs('golf','round');
  const live=liveLogs('golf','round').filter(l=>roundTotals(l).played>0);
  const avg=live.length?(live.reduce((a,l)=>a+(Number(l.vspar)||0),0)/live.length):null;
  const yr=countLast('golf','round',365);
  const sorted=[...rounds].sort((a,b)=>a.date<b.date?1:-1);
  return backBar('Golfing','golf')+`
    <div class="stats three">
      ${statTile(avg==null?'—':(avg>0?'+':'')+avg.toFixed(1),'handicap')}
      ${statTile(yr,'rounds — past year')}
      ${statTile(rounds.length,'rounds all-time')}
    </div>
    <div class="card"><h2><span class="grow">Scorecards</span><span class="badge">${sorted.length}</span></h2>
      <div class="rowlist">${sliceList('cards',sorted,l=>{
        const t=roundTotals(l);
        return `<div class="row" data-sheet="golf-card" data-arg="${l.id}" role="button" style="cursor:pointer">
          <div class="main"><div class="t">${esc(l.course||'Round')}</div>
            <div class="s">${fmtDate(l.date)} · ${t.played?`${t.played}/${t.holes} holes`:'not started'}</div></div>
          <span class="num">${t.played?t.strokes:'—'} ${t.played?`<span class="${t.score>0?'sc-plus':t.score<0?'sc-minus':'sc-even'}">${t.score>0?'+':''}${t.score}</span>`:''}</span>
          ${ICONS.chevR.replace('<svg','<svg width="18" height="18" style="color:var(--ink3)"')}
        </div>`;},'<div class="empty">Start a scorecard when you tee off</div>')}
      </div>
    </div>
    ${bigBtn('golf-newcard','Start a scorecard','golf')}
    <div class="card"><h2><span class="grow">Map</span><span class="badge">${state.golf.courses.length}</span></h2>
      <div class="pinboard">${state.golf.courses.map(c=>{
        const n=rounds.filter(r=>r.courseId===c.id).length;
        const parN=Object.values(c.pars||{}).reduce((a,b)=>a+Number(b),0);
        return `<div class="pin">
          <span class="pdot" style="background:${htint('golf')};color:${hcolor('golf')}">${ICONS.pinIc}</span>
          <div class="main"><div class="t">${esc(c.name)}</div>
            <div class="s">${esc(c.location||'')}${c.location?' · ':''}${parN?'par '+parN:'no pars set'} · ${n} round${n===1?'':'s'}</div></div>
          <a class="rowbtn" href="${mapsUrl(c.name,c.location)}" target="_blank" rel="noopener" aria-label="Open in Maps">${ICONS.ext}</a>
          <button class="rowbtn" data-sheet="golf-editcourse" data-arg="${c.id}" aria-label="Edit course">${ICONS.edit}</button>
        </div>`;}).join('')||'<div class="empty">Add the courses you play</div>'}

}

<script>
'use strict';
/* ============================================================
   Sheets — every add / edit flow
   ============================================================ */

let calMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);
let calSel=todayStr();
let anSel='total';
function ctxDate(){return view.tab==='cal'&&!view.page?calSel:todayStr();}
function dateField(id){return `<label>Date</label><input type="date" id="${id||'sh-date'}" value="${ctxDate()}">`;}
function shDate(el){return el.querySelector('#sh-date')?.value||todayStr();}
/* SHEETS is declared in the core so earlier modules can register into it */

/* ---------- edit sheets for the simpler lists ---------- */
function editSheet({title,fields,onSave,onDelete}){
  openSheet({title,
    body:fields.map(f=>f.type==='select'
      ? `<label>${esc(f.label)}</label><select id="${f.id}">${f.options.map(o=>`<option ${o===f.value?'selected':''}>${esc(o)}</option>`).join('')}</select>`
      : `<label>${esc(f.label)}</label><input id="${f.id}" ${f.numeric?'type="number" inputmode="decimal"':''} value="${esc(f.value==null?'':f.value)}" placeholder="${esc(f.ph||'')}">`
    ).join(''),
    actions:[{label:'Delete',style:'danger',handler:()=>{onDelete&&onDelete();}},
      {label:'Save',handler:(el)=>{
        const vals={};
        fields.forEach(f=>{vals[f.id]=el.querySelector('#'+f.id).value.trim();});
        return onSave(vals,el);
      }}]});
}

/* ---------- themes ---------- */
SHEETS['themes']=()=>{
  const cards=THEMES.map(t=>`
    <button class="themecard ${state.theme===t.id?'on':''}" data-theme="${t.id}">
      <span class="tick">${ICONS.check}</span>
      <span class="sw">${t.swatch.map(c=>`<i style="background:${c}"></i>`).join('')}</span>
      <span class="nm">${t.name}<small>${esc(t.note)}</small></span>
    </button>`).join('');
  const rots=ROTATIONS.map(r=>
    `<button class="${state.themeRotate===r.id?'on':''}" data-rot="${r.id}">${r.name}</button>`).join('');
  openSheet({title:'Themes',
    body:`<div class="themegrid">${cards}</div>
      <hr class="hr">
      <h2 style="font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)">Switch automatically</h2>
      <div class="chips" style="margin-top:8px">${rots}</div>
      <p class="note" id="rot-note"></p>`,
    onMount(el){
      const note=el.querySelector('#rot-note');
      const paintNote=()=>{
        const r=rotationOf();
        if(!r.mins){ note.textContent='Themes stay where you put them.'; return; }
        const due=rotationDueAt();
        const t=new Date(due).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
        note.textContent=`Moves to the next theme every ${r.label}. Next change around ${t}.`;
      };
      el.querySelectorAll('[data-theme]').forEach(b=>b.addEventListener('click',()=>{
        applyTheme(b.dataset.theme);
        state.themeRotateAt=Date.now(); save();
        el.querySelectorAll('[data-theme]').forEach(x=>x.classList.toggle('on',x===b));
        render(); paintNote();
      }));
      el.querySelectorAll('[data-rot]').forEach(b=>b.addEventListener('click',()=>{
        state.themeRotate=b.dataset.rot;
        state.themeRotateAt=Date.now();
        save();
        el.querySelectorAll('[data-rot]').forEach(x=>x.classList.toggle('on',x===b));
        paintNote();
      }));
      paintNote();
    }});
};

/* ---------- settings ---------- */
SHEETS['settings']=()=>{
  openSheet({title:'Settings & backup',
    body:`<p class="sub">Your data lives on this phone. Export a backup now and then.</p>
      ${state.lastBackup?`<p class="note">Last backup: ${fmtDate(state.lastBackup)}</p>`:'<p class="note" style="color:var(--danger)">No backup yet.</p>'}
      <div class="actions" style="margin-top:10px">
        <button class="btn" id="bk-exp">Export backup</button>
        <button class="btn quiet" id="bk-imp">Import backup</button>
      </div>
      <hr class="hr">
      <button class="btn danger" id="bk-reset">Erase all data</button>
      <p class="note">Always open Life Dashboard from its Home Screen icon — Safari tabs keep a separate copy of your data.</p>`,
    onMount(el){

      el.querySelector('#bk-exp').addEventListener('click',exportBackup);
      el.querySelector('#bk-imp').addEventListener('click',importBackup);
      el.querySelector('#bk-reset').addEventListener('click',()=>{
        openSheet({title:'Erase everything?',sub:'This deletes all logs, lists and photos on this device.',
          actions:[{label:'Cancel',style:'quiet',handler:()=>{}},
                   {label:'Erase all data',style:'danger',handler:()=>{
                      state=defaultState();save();
                      [...photoCache.keys()].forEach(photoDelete);
                      render();toast('Erased');}}]});
      });
    }});
};
async function exportBackup(){
  const payload=JSON.stringify({app:'life-dashboard',v:3,exported:todayStr(),state,photos:[...photoCache.values()]});
  let dl=null;
  try{ dl=window.claude&&await window.claude.use('downloads'); }catch(e){}
  if(dl){
    try{ await dl.save({filename:`life-dashboard-backup-${todayStr()}.json`,data:payload});
      state.lastBackup=todayStr();save();render();toast('Backup saved');return;
    }catch(e){ if(e&&e.code==='user_denied'){toast('Backup canceled');return;} }
  }
  openSheet({title:'Backup data',sub:'Copy this and keep it somewhere safe.',
    body:`<textarea id="bk-txt" rows="6" readonly style="font-size:11px">${esc(payload)}</textarea>`,
    actions:[{label:'Copy to clipboard',handler:async(el)=>{
      try{await navigator.clipboard.writeText(payload);}catch(e){el.querySelector('#bk-txt').select();document.execCommand('copy');}
      state.lastBackup=todayStr();save();render();toast('Copied');}}]});
}
function importBackup(){
  openSheet({title:'Import backup',sub:'This replaces what’s on this phone.',
    body:`<button class="btn quiet" id="imp-file" style="margin-top:6px">Choose backup file</button>
      <label>Or paste backup text</label><textarea id="imp-txt" rows="4" placeholder="{…}"></textarea>`,
    actions:[{label:'Cancel',style:'quiet',handler:()=>{}},
      {label:'Restore',handler:(el)=>{const t=el.querySelector('#imp-txt').value.trim();if(!t){toast('Nothing to restore');return false;}return doRestore(t);}}],
    onMount(el){
      el.querySelector('#imp-file').addEventListener('click',()=>{
        const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json,text/plain';
        inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();
          r.onload=()=>{if(doRestore(r.result)!==false)closeSheet();};r.readAsText(f);};
        inp.click();
      });
    }});
}
function doRestore(text){
  try{
    const data=JSON.parse(text);
    if(!data.state||!Array.isArray(data.state.logs))throw 0;
    state=data.state;
    (function(){const d=defaultState();for(const k in d){if(state[k]===undefined)state[k]=d[k];}})();
    save();
    [...photoCache.keys()].forEach(photoDelete);
    (data.photos||[]).forEach(photoPut);
    runSeeds(); render(); toast('Backup restored');
  }catch(e){toast('That file isn’t a Life Dashboard backup');return false;}
}

function bookSheet({title,rec,onDone,heading}){
  openSheet({title:heading||'Log a finished book',
    body:`<label>Title</label><input id="sh-t" value="${esc(rec?rec.title:(title||''))}" placeholder="Book title">

      <label>Your rating</label>${starBox(rec?rec.rating:0)}
      <label>Review (optional)</label>${richField('sh-rev',rec?rec.review:'','What did you make of it?')}
      <label>Date</label><input type="date" id="sh-date" value="${rec?rec.date:ctxDate()}">`,
    actions:[{label:rec?'Delete':'Cancel',style:rec?'danger':'quiet',handler:()=>{
        if(rec){SHEETS['book-delete'](rec.id);}

      {label:'Save',handler:(el)=>{

        if(!t){toast('Needs a title');return false;}
        onDone({title:t,author:el.querySelector('#sh-a').value.trim(),rating:starVal(el),
          review:richVal(el,'sh-rev'),date:shDate(el)});
      }}]});
}

SHEETS['book-delete']=(id)=>{

/* ---------- MUSIC ---------- */
function albumSheet({rec,heading,onDone,withRating,withDate}){
  let cover=rec?rec.coverId:null, pending=null;
  openSheet({title:heading||'Album',
    body:`<label>Album</label><input id="sh-t" value="${esc(rec?rec.title:'')}" placeholder="Album title">
      <label>Artist</label><input id="sh-a" value="${esc(rec?rec.artist:'')}" placeholder="Artist">
      ${withRating?`<label>Your rating</label>${starBox(rec?rec.rating:0)}`:''}
      <label>Cover art</label>
      <button type="button" class="btn quiet" id="sh-cov">${ICONS.camera} ${cover?'Change cover':'Add cover from photos'}</button>
      <img id="sh-prev" class="${cover&&photoCache.get(cover)?'':'hidden'}" src="${cover&&photoCache.get(cover)?photoCache.get(cover).dataUrl:''}" alt="" style="width:120px;border-radius:12px;margin-top:10px;display:block">
      ${withDate?`<label>Date</label><input type="date" id="sh-date" value="${rec?rec.date:ctxDate()}">`:''}`,
    actions:[{label:rec?'Delete':'Cancel',style:rec?'danger':'quiet',handler:()=>{
        if(rec&&rec.__del)rec.__del();
      }},
      {label:'Save',handler:(el)=>{
        const t=el.querySelector('#sh-t').value.trim();
        if(!t){toast('Needs a title');return false;}
        let coverId=cover;
        if(pending){
          if(cover)photoDelete(cover);
          const p={id:uid(),dataUrl:pending,kind:'cover',title:t,date:todayStr()};
          photoPut(p); coverId=p.id;
        }
        onDone({title:t,artist:el.querySelector('#sh-a').value.trim(),
          rating:withRating?starVal(el):0,coverId,
          date:withDate?shDate(el):(rec?rec.date:todayStr())});
      }}],
    onMount(el){
      el.querySelector('#sh-cov').addEventListener('click',()=>{
        pickImage(d=>{pending=d;const i=el.querySelector('#sh-prev');i.src=d;i.classList.remove('hidden');});
      });
    }});
}

function parGridHtml(pars){

    <input data-par="${h}" type="number" inputmode="numeric" value="${pars[h]||''}" placeholder="—" style="padding:7px 2px;text-align:center;font-size:14px;border-radius:8px"></div>`;
  const tot=Object.values(pars||{}).reduce((a,b)=>a+Number(b||0),0);
  return `<div style="font-size:11px;font-weight:800;color:var(--ink3);margin-top:8px">FRONT</div>

    ${holesFor('back').map(cell).join('')}</div>

}
function wireParGrid(el){
  const upd=()=>{
    let t=0; el.querySelectorAll('[data-par]').forEach(i=>t+=Number(i.value)||0);
    const o=el.querySelector('[data-partot]'); if(o)o.textContent=t||'—';

  upd();
}

SHEETS['golf-card']=(logId)=>{
  const log=state.logs.find(l=>l.id===logId); if(!log)return;
  const holes=holesFor(log.holes||'full');
  log.pars=log.pars||{}; log.byHole=log.byHole||{};
  const hasPars=holes.some(h=>Number(log.pars[h]));
  const scoreCell=(h)=>{
    const par=Number(log.pars[h]),st=Number(log.byHole[h]);
    if(!par||!st)return '<span class="sc-even">—</span>';
    const d=st-par;
    return `<span class="${d>0?'sc-plus':d<0?'sc-minus':'sc-even'}">${d>0?'+':''}${d}</span>`;
  };
  const half=(label,list)=>`
    ${log.holes==='full'?`<tr><td colspan="4" style="text-align:left;font-size:10.5px;font-weight:800;color:var(--ink3);letter-spacing:.06em;padding-top:8px">${label}</td></tr>`:''}
    ${list.map(h=>`<tr data-h="${h}">
      <td class="h">${h}</td>
      <td style="font-weight:700;color:var(--ink2);font-size:15px">${log.pars[h]||'—'}</td>
      <td><input data-fs="${h}" type="number" inputmode="numeric" value="${log.byHole[h]||''}" placeholder="—"></td>
      <td class="sc" data-sc="${h}">${scoreCell(h)}</td>
    </tr>`).join('')}`;
  const body=log.holes==='full'
    ? half('FRONT',holes.slice(0,9))+half('BACK',holes.slice(9))
    : half('',holes);
  openSheet({title:log.course||'Scorecard',
    sub:`${fmtDate(log.date)} · ${log.holes==='full'?'18 holes':log.holes==='front'?'front 9':'back 9'}`,
    body:`${hasPars?'':`<button type="button" class="btn quiet sm" id="fixpars" style="margin-bottom:10px">Set this course’s pars</button>`}
    <div class="chartwrap"><table class="sctable">
      <thead><tr><th>Hole</th><th>Par</th><th>Strokes</th><th>Score</th></tr></thead>
      <tbody>${body}</tbody>
      <tfoot><tr class="tot"><td class="h">Tot</td>
        <td data-totpar>—</td><td data-totstrokes>—</td><td class="sc" data-totscore>—</td></tr></tfoot>
    </table></div>`,
    actions:[{label:'Delete round',style:'danger',handler:()=>{delLog(logId);render();toast('Round deleted');}},
      {label:'Done',handler:()=>{render();}}],
    onMount(el){
      const fix=el.querySelector('#fixpars');
      if(fix)fix.addEventListener('click',()=>{closeSheet(true);SHEETS['golf-editcourse'](log.courseId);});
      const recalc=()=>{
        let tp=0,ts=0,score=0,played=0;
        holes.forEach(h=>{
          const par=Number(log.pars[h])||0,st=Number(log.byHole[h])||0;
          tp+=par;
          if(st){ ts+=st; score+=st-par; played++; }
          const cell=el.querySelector(`[data-sc="${h}"]`);
          if(cell)cell.innerHTML=scoreCell(h);
        });
        el.querySelector('[data-totpar]').textContent=tp||'—';
        el.querySelector('[data-totstrokes]').textContent=played?ts:'—';
        el.querySelector('[data-totscore]').innerHTML=played
          ?`<span class="${score>0?'sc-plus':score<0?'sc-minus':'sc-even'}">${score>0?'+':''}${score}</span>`:'—';
        log.strokes=ts; log.vspar=played?score:0;
        save();
      };
      el.querySelectorAll('[data-fs]').forEach(i=>i.addEventListener('input',()=>{
        const h=i.dataset.fs; if(i.value)log.byHole[h]=Number(i.value); else delete log.byHole[h]; recalc();
      }));
      recalc();
    }});
};

    body:`<label>Resort</label><select id="sh-r"><option value="">—</option>${opts}</select>

          save();render();toast('Recipe deleted');

      }},
      {label:'Save',handler:(el)=>{
        const t=el.querySelector('#sh-t').value.trim();
        if(!t){toast('Needs a title');return false;}
        const data={title:t,yield:el.querySelector('#sh-y').value.trim(),
          calories:el.querySelector('#sh-cal').value,price:el.querySelector('#sh-pr').value,
          protein:el.querySelector('#sh-p').value,carbs:el.querySelector('#sh-c').value,fat:el.querySelector('#sh-f').value,
          ingredients:richVal(el,'sh-i'),steps:richVal(el,'sh-s')};
        if(rec){Object.assign(rec,data);save();}

          const r={id:uid(),...data,date:todayStr()};
          state.cooking.recipes.push(r);
          addLog('cooking','recipe',{title:t,refId:r.id});

        render();toast('Recipe saved 🍳');
      }}]});
}

<script>
'use strict';
/* ============================================================
   Calendar · analytics · cadence notifications · boot
   ============================================================ */

/* ---------- calendar ---------- */
const QUICK={
  film:['film-rate','film-addwatch'],reading:['book-log','book-addwish'],drawing:['draw-add'],
  music:['album-log','album-like'],lifting:['cal-lift','proto-weigh'],golf:['golf-newcard'],skiing:['ski-day'],

SHEETS['cal-month']=()=>{
  let y=calMonth.getFullYear();
  const draw=(el)=>{
    el.querySelector('[data-y]').textContent=y;
    el.querySelectorAll('[data-m]').forEach(b=>{
      b.classList.toggle('on',Number(b.dataset.m)===calMonth.getMonth()&&y===calMonth.getFullYear());
    });
  };
  openSheet({title:'Jump to month',
    body:`<div class="yearpick">
        <button class="iconbtn" data-ystep="-1" aria-label="Previous year">${ICONS.chevL}</button>

        <button class="iconbtn" data-ystep="1" aria-label="Next year">${ICONS.chevR}</button>

      <div class="monthgrid">${MONTHS.map((m,i)=>`<button data-m="${i}">${m.slice(0,3)}</button>`).join('')}</div>`,
    onMount(el){
      draw(el);
      el.querySelectorAll('[data-ystep]').forEach(b=>b.addEventListener('click',()=>{
        y+=Number(b.dataset.ystep); draw(el);
      }));
      el.querySelectorAll('[data-m]').forEach(b=>b.addEventListener('click',()=>{
        calMonth=new Date(y,Number(b.dataset.m),1);
        closeSheet(); render();
      }));
    }});
};
function pageCalendar(){
  const y=calMonth.getFullYear(),m=calMonth.getMonth();
  const first=new Date(y,m,1),startDow=first.getDay(),dim=new Date(y,m+1,0).getDate();
  const byDate={};
  state.logs.filter(l=>!l.imported).forEach(l=>{(byDate[l.date]=byDate[l.date]||[]).push(l);});
  let cells='';
  for(let i=0;i<startDow;i++)cells+='<div class="cald out"></div>';
  const remByDate={};
  state.reminders.forEach(r=>{(remByDate[r.date]=remByDate[r.date]||[]).push(r);});
  for(let d=1;d<=dim;d++){
    const ds=dstr(new Date(y,m,d));
    const hobbies=[...new Set((byDate[ds]||[]).map(l=>l.hobby))].slice(0,3);
    const rems=[...new Set((remByDate[ds]||[]).filter(r=>!r.done).map(r=>r.hobby))].slice(0,2);
    cells+=`<button class="cald ${ds===todayStr()?'today':''} ${ds===calSel?'sel':''}" data-day="${ds}">
      <span class="dnum">${d}</span>
      <span class="dots">${hobbies.map(h=>`<i style="background:${hcolor(h)}"></i>`).join('')}${
        rems.map(h=>`<i class="rem" style="background:${hcolor(h)}"></i>`).join('')}</span>
    </button>`;
  }
  const sel=byDate[calSel]||[];
  const selRem=(remByDate[calSel]||[]);
  return `
    <div class="apphead"><div><div class="date">Plan & log</div><h1>Calendar</h1></div></div>
    <div class="card">
      <div class="calhead">
        <button class="mbtn" data-sheet="cal-month">${calMonth.toLocaleDateString(undefined,{month:'long',year:'numeric'})}${ICONS.chevD}</button>
        <div class="navs">
          <button class="iconbtn" data-cal="-1" aria-label="Previous month">${ICONS.chevL}</button>
          <button class="iconbtn" data-cal="1" aria-label="Next month">${ICONS.chevR}</button>
        </div>
      </div>
      <div class="calgrid">
        ${['S','M','T','W','T','F','S'].map(d=>`<div class="dow">${d}</div>`).join('')}
        ${cells}
      </div>
    </div>
    <div class="card"><h2><span class="grow">${calSel===todayStr()?'Today':fmtDate(calSel)} · planned</span><span class="badge">${selRem.length}</span></h2>
      <div class="rowlist">${selRem.map(r=>`
        <div class="remrow ${r.done?'done':''}">
          <button class="chk ${r.done?'on':''}" data-remdone="${r.id}" style="padding:0;border:none;flex:none;width:auto">
            <span class="box">${ICONS.check}</span></button>
          <span class="ic-${r.hobby}" style="width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none">${ICONS[r.hobby]}</span>
          <div class="main" data-sheet="rem-edit" data-arg="${r.id}" role="button" style="cursor:pointer">
            <div class="t">${esc(H[r.hobby]?H[r.hobby].name:'Reminder')}</div>
            <div class="s">${esc(r.note||'')}${r.repeat?(r.note?' · ':'')+'repeats every '+r.repeat+'d':''}</div></div>
          <button class="rowbtn" data-sheet="rem-edit" data-arg="${r.id}" aria-label="Edit">${ICONS.edit}</button>
        </div>`).join('')||'<div class="empty">Nothing planned — tap + to schedule</div>'}</div>
    </div>
    <div class="card"><h2><span class="grow">Logged</span><span class="badge">${sel.length}</span></h2>
      <div class="rowlist">${sel.map(l=>`
        <div class="row">
          <span class="ic-${l.hobby}" style="width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none">${ICONS[l.hobby]}</span>
          <div class="main"><div class="t">${esc(logLabel(l))}</div><div class="s">${H[l.hobby].name}</div></div>
          <button class="rowbtn" data-dellog="${l.id}" aria-label="Delete">${ICONS.trash}</button>
        </div>`).join('')||'<div class="empty">Nothing logged this day</div>'}</div>
    </div>
    <button class="fab" data-sheet="cal-picker" aria-label="Schedule a reminder">${ICONS.plus}</button>`;
}
function logLabel(l){
  if(l.type==='movie')return (l.title||'Movie')+(l.rating?` · ${fmtStars(l.rating)}★`:'');
  if(l.type==='book')return l.title||'Book finished';
  if(l.type==='album')return l.title||'Album listened';
  if(l.type==='drawing')return l.title||'Drawing';
  if(l.type==='workout')return l.title||'Workout';
  if(l.type==='round')return `${l.course||'Round'} · ${l.strokes||0} (${l.vspar>0?'+':''}${l.vspar||0})`;
  if(l.type==='skiday')return `${l.resort||'Ski day'}${l.runs?` · ${l.runs} runs`:''}`;
  if(l.type==='recipe')return `Recipe · ${l.title||''}`;
  if(l.type==='plate')return `Plate · ${l.title||''}`;
  if(l.type==='restaurant')return `Ranked ${l.title||'a restaurant'}`;
  if(l.type==='session')return `Tennis · ${fmtMin(l.minutes||0)}`;
  if(l.type==='entry')return l.title||'Journal entry';
  return l.type;
}

/* ---------- charts ---------- */
function weeklySeries(weeks,fn){
  const values=[],labels=[];
  const w0=startOfWeek(new Date());
  for(let i=weeks-1;i>=0;i--){
    const ws=new Date(w0);ws.setDate(ws.getDate()-7*i);
    const we=new Date(ws);we.setDate(we.getDate()+7);
    values.push(fn(ws,we));
    labels.push(ws.toLocaleDateString(undefined,{month:'numeric',day:'numeric'}));
  }
  return {values,labels};
}
function weeklyCounts(hobby,weeks,type){
  return weeklySeries(weeks,(ws,we)=>state.logs.filter(l=>!l.imported&&(!hobby||l.hobby===hobby)&&(!type||l.type===type)&&parseD(l.date)>=ws&&parseD(l.date)<we).length);
}
function weeklySums(hobby,type,field,weeks){
  return weeklySeries(weeks,(ws,we)=>state.logs.filter(l=>!l.imported&&l.hobby===hobby&&(!type||l.type===type)&&parseD(l.date)>=ws&&parseD(l.date)<we)
    .reduce((a,l)=>a+(Number(l[field])||0),0));
}
function barChart(values,labels,color,opts={}){
  const W=520,Hh=150,pad=8,axis=20;
  const max=Math.max(1,...values);
  const bw=(W-pad*2)/values.length;
  const maxIdx=values.indexOf(Math.max(...values));
  let bars='';
  values.forEach((v,i)=>{
    const h=v/max*(Hh-pad-axis-16);
    const x=pad+i*bw+2,y=Hh-axis-h;
    bars+=`<rect class="bar" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw-4).toFixed(1)}" height="${Math.max(h,v?3:1).toFixed(1)}" fill="${v?color:'var(--line)'}" opacity="${v?1:.6}"><title>${labels[i]}: ${v.toLocaleString()}</title></rect>`;
    if(i===maxIdx&&v>0)bars+=`<text x="${(x+(bw-4)/2).toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink2)">${v.toLocaleString()}</text>`;
  });
  const ticks=labels.map((lb,i)=>(opts.allTicks||i===0||i===labels.length-1)?`<text x="${(pad+i*bw+(bw-4)/2).toFixed(1)}" y="${Hh-5}" text-anchor="middle" font-size="10" fill="var(--ink3)">${lb}</text>`:'').join('');
  return `<div class="chartwrap"><svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Bar chart">
    <line x1="${pad}" y1="${Hh-axis}" x2="${W-pad}" y2="${Hh-axis}" stroke="var(--line)" stroke-width="1"/>
    ${bars}${ticks}</svg></div>`;
}

/* ---------- cadence (targets stay internal) ---------- */
const EPOCH='2020-01-06';
function periodIndex(dateStr,W){return Math.floor(daysBetween(EPOCH,dateStr)/W);}
function inSeason(t,d){
  if(!t.months)return true;
  return t.months.includes((d||new Date()).getMonth());
}
function cadenceStatus(key){
  const t=TARGETS[key]; if(!t)return null;
  if(!inSeason(t))return {t,offSeason:true};
  const n=countLast(key,t.type,t.windowDays);
  const status=n<t.min?'below':n>t.max?'above':'on';
  return {t,n,status};
}
function cadenceText(key){
  const c=cadenceStatus(key); if(!c)return '';
  if(c.offSeason)return 'off-season';
  const per=c.t.windowDays===7?'this week':c.t.windowDays===2?'2 days':c.t.windowDays===14?'2 weeks':'this month';
  return `${c.n} · ${per}`;
}
function periodCount(key,idx){
  const t=TARGETS[key];
  return state.logs.filter(l=>!l.imported&&l.hobby===key&&l.type===t.type&&periodIndex(l.date,t.windowDays)===idx).length;
}
function notifyCopy(key,n,status,t){
  const name=H[key].name;
  if(status==='above'){
    const msgs={
      film:`${n} movies. You're ahead of your own pace and it shows — keep the reel rolling.`,
      reading:`${n} books this stretch. That's above your target and it's genuinely impressive.`,
      drawing:`${n} drawings. More than you aim for — the practice is compounding.`,
      music:`${n} albums this week. Above target. Your ears are doing great work.`,
      lifting:`${n} sessions this week. Above the plan and consistent — this is exactly what builds.`,
      golf:`${n} rounds this month. More course time than you planned. Excellent.`,
      skiing:`${n} days on the mountain. Above target — enjoy every one.`,
      cooking:`${n} restaurants this week. You're out and exploring. Love it.`,
      tennis:`${n} sessions this week. Above target — the consistency is real.`,
      journal:`${n} entries. Writing more than you set out to. That's the habit sticking.`,
    };
    return {title:`${name} — ahead of pace 🎉`,body:msgs[key]||`${n} logs. Above target.`};
  }
  const per=t.windowDays===7?'this week':t.windowDays===2?'in the last two days':t.windowDays===14?'in the last two weeks':'this month';
  return {title:`${name} — below your range`,body:`${n} logged ${per}. Your usual is ${t.min===t.max?t.min:t.min+'–'+t.max} ${t.label}.`};
}
function fireNotification(title,body){
  try{
    if(typeof Notification==='undefined'||Notification.permission!=='granted')return;
    if(navigator.serviceWorker&&navigator.serviceWorker.ready){
      navigator.serviceWorker.ready
        .then(reg=>reg.showNotification(title,{body,icon:'./icon-192.png',badge:'./icon-192.png',tag:title}))
        .catch(()=>{try{new Notification(title,{body});}catch(e){}});
    }else{ new Notification(title,{body}); }
  }catch(e){}
}
async function enableNotifications(){
  if(typeof Notification==='undefined'){toast('This browser can’t show notifications');return false;}
  let perm=Notification.permission;
  if(perm==='default'){ try{ perm=await Notification.requestPermission(); }catch(e){ perm='denied'; } }
  if(perm!=='granted'){toast('Turn notifications on for this app in iOS Settings');return false;}
  state.notify.enabled=true; save(); return true;
}
function notifyReady(){
  return state.notify.enabled&&typeof Notification!=='undefined'&&Notification.permission==='granted';
}
function checkCadence(){
  if(!notifyReady())return;
  if(state.notify.cadence!==false){
    Object.keys(TARGETS).forEach(key=>{
      const t=TARGETS[key];
      const last=periodIndex(todayStr(),t.windowDays)-1;
      if(state.notify.sent[key]===last)return;
      const endOfLast=new Date(parseD(EPOCH));
      endOfLast.setDate(endOfLast.getDate()+(last+1)*t.windowDays-1);
      if(!inSeason(t,endOfLast)){ state.notify.sent[key]=last; return; }
      const n=periodCount(key,last);
      const status=n<t.min?'below':n>t.max?'above':'on';
      state.notify.sent[key]=last;
      if(status==='on')return;
      const c=notifyCopy(key,n,status,t);
      pushNotif({kind:'cadence',hobby:key,title:c.title,body:c.body});
    });
  }
  checkProtocolNotices();
  checkReminders();
  save();
}
/* scheduled reminders: fire on or after their day, once each, then repeat if set */
function checkReminders(){
  if(state.notify.reminders===false)return;
  const today=todayStr();
  let touched=false;
  state.reminders.forEach(r=>{
    if(r.done)return;
    if(r.date>today)return;
    if(r.firedOn===today)return;
    r.firedOn=today; touched=true;
    const name=H[r.hobby]?H[r.hobby].name:'Reminder';
    const late=daysBetween(r.date,today);
    pushNotif({kind:'reminder',hobby:r.hobby,page:r.hobby,
      title:`${name} — scheduled${late>0?` ${late}d ago`:' today'}`,
      body:r.note||`You planned ${name.toLowerCase()} for ${fmtDate(r.date)}.`});
  });
  if(touched)save();
}
function completeReminder(id){
  const r=state.reminders.find(x=>x.id===id); if(!r)return;
  if(r.repeat&&!r.done){
    const nd=new Date(parseD(r.date).getTime()+r.repeat*DAY);
    r.date=dstr(nd); r.firedOn=null;
  }else{
    r.done=!r.done;
  }
  save(); render();
}
function dailyComplete(dateStr){
  const d=state.protocol.daily[dateStr]||{};
  return DAILY_ITEMS.every(i=>d[i.k])&&!!d.weight;
}
function checkProtocolNotices(){
  if(!notifyReady())return;
  const wk=protoWeek();
  if(!wk||wk>PROTO.weeks)return;
  const today=todayStr();

  // yesterday's daily checklist
  if(state.notify.daily!==false){
    const y=new Date(); y.setDate(y.getDate()-1);
    const ys=dstr(y);
    if(ys>=state.protocol.startDate&&state.notify.sent['daily']!==ys&&!dailyComplete(ys)){
      const d=state.protocol.daily[ys]||{};
      const missed=[...DAILY_ITEMS.filter(i=>!d[i.k]).map(i=>i.t.split(' —')[0]),...(d.weight?[]:['Weigh in'])];
      state.notify.sent['daily']=ys;
      pushNotif({kind:'daily',hobby:'lifting',page:'lifting',title:'Yesterday’s checklist',body:`${missed.length} item${missed.length===1?'':'s'} unlogged: ${missed.join(', ')}.`});
    }
  }
  // Sunday tasks
  if(state.notify.sunday!==false&&new Date().getDay()===0){
    if(state.notify.sent['sunday']!==today&&state.protocol.weeklyWaist[wk]==null){
      state.notify.sent['sunday']=today;
      pushNotif({kind:'sunday',hobby:'lifting',page:'lifting',title:'Sunday — waist and weekly average',body:`Measure your waist at the navel for week ${wk}, then check the week’s weight average.`});
    }
  }
  // checkpoints
  if(state.notify.checkpoints!==false){
    PROTO.checkpoints.forEach(w=>{
      if(wk<w)return;
      const c=state.protocol.checkpoints[w]||{};
      if(c.done)return;
      if(state.notify.sent['cpt'+w])return;
      state.notify.sent['cpt'+w]=today;
      pushNotif({kind:'checkpoint',hobby:'lifting',page:'lifting',title:`Week ${w} checkpoint`,body:w===16?'Final photos and measurements are due.':'Photos and a waist-trend review are due.'});
    });
  }
}

/* ---------- analytics ---------- */
function pageAnalytics(){
  const opts=[['total','Totals — all hobbies'],...HOBBIES.filter(h=>h.key!=='fashion').map(h=>[h.key,h.name])];
  return `
    <div class="apphead"><div><div class="date">The big picture</div><h1>Analytics</h1></div></div>
    <div class="card anselect" style="padding:10px 12px;margin-bottom:14px">
      <select id="an-sel" aria-label="Choose analytics view">${opts.map(([v,n])=>`<option value="${v}" ${anSel===v?'selected':''}>${n}</option>`).join('')}</select>
    </div>
    ${anSel==='total'?anTotalHtml():anHobbyHtml(anSel)}`;
}
function anTotalHtml(){
  const per=(days)=>liveLogs().filter(l=>inLastDays(l.date,days)).length;
  const wk=weeklyCounts(null,12);
  const rows=HOBBIES.filter(h=>h.key!=='fashion').map(h=>({h,c:cadenceStatus(h.key)}))
    .sort((a,b)=>{
      const rank=s=>s.offSeason?3:s.status==='below'?0:s.status==='on'?2:1;
      return rank(a.c)-rank(b.c);
    });

  return `
    <div class="stats three">
      ${statTile(per(7),'weekly')}
      ${statTile(per(30),'monthly')}
      ${statTile(per(90),'past 12 weeks')}
    </div>
    <div class="card"><h2>Logs per week · last 12 weeks</h2>${barChart(wk.values,wk.labels,'var(--accent)')}</div>
    <div class="card"><h2>Falling behind</h2>
      <div class="attn">${rows.map(({h,c})=>`
        <div class="arow ${c.offSeason?'':c.status}">
          <span class="ic ic-${h.key}">${ICONS[h.key]}</span>
          <span class="t">${h.name}</span>
          <span class="d">${c.offSeason?'off-season':cadenceText(h.key)+(c.status==='below'?' · below':c.status==='above'?' · ahead':' · on track')}</span>
        </div>`).join('')}
      </div>
    </div>`;
}
function anHobbyHtml(key){
  let tiles='',chartTitle='Logs per week',series=weeklyCounts(key,12);
  if(key==='film'){
    tiles=statTile(logs('film','movie').length+off('film.total'),'movies — lifetime')+statTile(countLast('film','movie',30),'past month');
    chartTitle='Movies per week';series=weeklyCounts('film',12,'movie');
  }else if(key==='reading'){
    tiles=statTile(logs('reading','book').length+off('reading.total'),'books — lifetime')+statTile(countLast('reading','book',90),'last 12 weeks');
    chartTitle='Books per week';series=weeklyCounts('reading',12,'book');
  }else if(key==='drawing'){
    tiles=statTile(logs('drawing','drawing').length+off('drawing.count'),'drawings — lifetime')+statTile(countLast('drawing','drawing',30),'past month');
    chartTitle='Drawings per week';series=weeklyCounts('drawing',12,'drawing');
  }else if(key==='music'){
    tiles=statTile(logs('music','album').length+off('music.total'),'albums — lifetime')+statTile(countLast('music','album',7),'past 7 days');
    chartTitle='Albums per week';series=weeklyCounts('music',12,'album');
  }else if(key==='lifting'){
    const wkN=liveLogs('lifting','workout').filter(l=>parseD(l.date)>=startOfWeek(new Date())).length;
    const pw=protoWeek();
    tiles=statTile(wkN,'lifts this week')+statTile(liveLogs('lifting','workout').length,'sessions all-time')
      +statTile(pw?('wk '+pw):'—','protocol week')+statTile(cycleVolume(state.lifting.cycle).toLocaleString(),'cycle volume');
    chartTitle='Sessions per week';series=weeklyCounts('lifting',12,'workout');
  }else if(key==='golf'){
    const rounds=liveLogs('golf','round');
    const a=rounds.length?rounds.reduce((x,l)=>x+(Number(l.vspar)||0),0)/rounds.length:null;
    tiles=statTile(a==null?'—':(a>0?'+':'')+a.toFixed(1),'handicap')+statTile(countLast('golf','round',30),'rounds this month')+statTile(logs('golf','round').length,'rounds all-time');
    chartTitle='Rounds per week';series=weeklyCounts('golf',12,'round');
  }else if(key==='skiing'){
    const all=logs('skiing','skiday');
    const yr=all.filter(l=>l.date.slice(0,4)===String(new Date().getFullYear()));
    const runsTotal=all.reduce((a,l)=>a+(Number(l.runs)||0),0);
    tiles=statTile(yr.length,'days this year')+statTile(yr.reduce((a,l)=>a+(Number(l.runs)||0),0),'runs this year')
      +statTile(runsTotal,'runs — total')+statTile(all.length?(runsTotal/all.length).toFixed(1):'—','runs per ski day');
    chartTitle='Runs per week';series=weeklySums('skiing','skiday','runs',12);
  }else if(key==='cooking'){
    tiles=statTile(state.cooking.recipes.length,'recipes')+statTile(photosOf('plate').length,'plates')
      +statTile(state.cooking.restaurants.filter(r=>!r.want).length,'ranked')+statTile(state.cooking.restaurants.filter(r=>r.want).length,'reservations');
    chartTitle='Restaurants per week';series=weeklyCounts('cooking',12,'restaurant');
  }else if(key==='tennis'){
    const mins=(days)=>liveLogs('tennis','session').filter(l=>days==null||inLastDays(l.date,days)).reduce((a,l)=>a+(Number(l.minutes)||0),0);
    tiles=statTile(countLast('tennis','session',365),'sessions · year')+statTile(fmtMin(mins(7)),'time · 7 days')+statTile(fmtMin(mins(365)),'time · year');
    chartTitle='Minutes per week';series=weeklySums('tennis','session','minutes',12);
  }else if(key==='journal'){
    tiles=statTile(logs('journal','entry').length,'total entries')+statTile(countLast('journal','entry',30),'past month');
    chartTitle='Entries per week';series=weeklyCounts('journal',12,'entry');
  }
  const c=cadenceStatus(key);
  const cls=(key==='golf'||key==='tennis')?' three':'';
  return `
    <div class="stats${cls}">${tiles}</div>
    <div class="card"><h2>${chartTitle} · last 12 weeks</h2>${barChart(series.values,series.labels,hcolor(key))}</div>
    ${c?`<div class="card"><h2>Cadence</h2>
      <div class="attn"><div class="arow ${c.offSeason?'':c.status}">
        <span class="ic ic-${key}">${ICONS[key]}</span>
        <span class="t">${c.offSeason?'Out of season':c.status==='below'?'Below your range':c.status==='above'?'Ahead of your range':'On track'}</span>
        <span class="d">${c.offSeason?'—':cadenceText(key)}</span>
      </div></div></div>`:''}`;
}

/* ---------- delegated events ---------- */
document.addEventListener('click',e=>{
  const cyc=e.target.closest('[data-cyc]');
  if(cyc){state.lifting.cycle=Number(cyc.dataset.cyc);save();render();return;}
  const cal=e.target.closest('[data-cal]');
  if(cal){calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+Number(cal.dataset.cal),1);render();return;}
  const day=e.target.closest('.cald[data-day]');
  if(day){calSel=day.dataset.day;render();return;}
  const setup=e.target.closest('[data-setup]');
  if(setup){
    const k=setup.dataset.setup;
    state.protocol.setup[k]=!state.protocol.setup[k];save();render();return;
  }
  const daily=e.target.closest('[data-daily]');
  if(daily){
    const k=daily.dataset.daily;
    setProtoDay({[k]:!protoDay()[k]});render();return;
  }
  const rd=e.target.closest('[data-remdone]');
  if(rd){ completeReminder(rd.dataset.remdone); return; }
  const dr=e.target.closest('[data-drink]');
  if(dr){
    const wk=protoWeek(); if(!wk)return;
    setWeekDrinks(wk,weekDrinks(wk)+Number(dr.dataset.drink));
    render(); return;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(!t||!t.dataset)return;
  if(t.dataset.wday!==undefined){
    const v=Number(t.value);
    if(v)setProtoDay({weight:v},t.dataset.wday);
    else{ const d=state.protocol.daily[t.dataset.wday]; if(d){delete d.weight;save();} }
    return;
  }
  if(t.dataset.waistwk!==undefined){
    const v=Number(t.value);
    if(v)state.protocol.weeklyWaist[t.dataset.waistwk]=v;
    else delete state.protocol.weeklyWaist[t.dataset.waistwk];
    save(); return;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t&&t.id==='an-sel'){anSel=t.value;render();window.scrollTo(0,0);return;}
  if(t&&t.dataset&&(t.dataset.wday!==undefined||t.dataset.waistwk!==undefined)){render();}
});

const APP_VERSION='2026.09.01-2';

if('serviceWorker' in navigator){

async function exportBackup(){
  const payload=JSON.stringify({app:'life-dashboard',v:3,exported:todayStr(),state,photos:[...photoCache.values()]});
  const name=`life-dashboard-backup-${todayStr()}.json`;
  try{
    const blob=new Blob([payload],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=name; a.rel='noopener';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},1000);
    state.lastBackup=todayStr(); save(); render(); toast('Backup saved to Files');
    return;
  }catch(e){}
  openSheet({title:'Backup data',sub:'Copy this and keep it somewhere safe.',
    body:`<textarea id="bk-txt" rows="6" readonly style="font-size:11px">${esc(payload)}</textarea>`,
    actions:[{label:'Copy to clipboard',handler:async(el)=>{
      try{await navigator.clipboard.writeText(payload);}catch(e2){el.querySelector('#bk-txt').select();document.execCommand('copy');}
      state.lastBackup=todayStr();save();render();toast('Copied');
    }}]});
}

        }catch(e){}
      })();
    }});
};
